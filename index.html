<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PRO IRON - 어깨 볼륨 & 타이머</title>
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #141418;
      --card-border: #27272a;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --primary: #38bdf8;
      --text-main: #f4f4f5;
      --text-sub: #71717a;
      --danger: #f43f5e;
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      touch-action: manipulation; 
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 120px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      padding: 16px 20px;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-sub);
      text-transform: uppercase;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    button { 
      cursor: pointer; 
      border: none; 
      font-family: inherit; 
      outline: none; 
      transition: transform 0.08s ease, background-color 0.1s ease; 
    }
    button:active { 
      transform: scale(0.95); 
    }

    .btn-icon {
      background: #1e1e24;
      color: #d4d4d8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #2e2e38;
    }
    .btn-finish-workout {
      background: rgba(244, 63, 94, 0.15);
      color: var(--danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .exercise-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .select-wrapper {
      position: relative;
      flex: 1;
    }
    .exercise-select {
      width: 100%;
      background: #18181b;
      color: #fff;
      border: 1px solid #2e2e38;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      appearance: none;
      outline: none;
    }
    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: var(--text-sub);
      pointer-events: none;
    }
    .btn-manage {
      background: #18181b;
      color: var(--primary);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #2e2e38;
      white-space: nowrap;
    }

    .meta-chips {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .chip {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #18181b;
      color: #a1a1aa;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .chip-accent {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.2);
    }

    .content {
      padding: 16px 20px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .set-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .set-card.is-done {
      background: #0f0f13;
      border-color: rgba(255, 255, 255, 0.03);
      opacity: 0.45;
    }

    .set-tag {
      font-size: 14px;
      font-weight: 800;
      color: #52525b;
      min-width: 24px;
      text-align: center;
    }
    .set-card.is-done .set-tag {
      color: var(--accent);
    }

    .stepper-capsule {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d0d10;
      border: 1px solid #222228;
      border-radius: 10px;
      padding: 4px;
    }
    .stepper-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #1c1c22;
      color: #e4e4e7;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stepper-btn:active {
      background: var(--primary);
      color: #000;
    }
    .stepper-val {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 44px;
    }
    .val-num {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .val-unit {
      font-size: 9px;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: -1px;
    }

    .btn-complete {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #1c1c22;
      border: 1px solid #2e2e38;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
    }
    .btn-complete.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .btn-del {
      background: transparent;
      color: #3f3f46;
      font-size: 16px;
      padding: 6px;
      border-radius: 6px;
    }
    .btn-del:active {
      color: var(--danger);
    }

    .btn-add-set {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.05);
      border: 1px dashed rgba(56, 189, 248, 0.25);
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    #timer-island {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 20px;
      right: 20px;
      background: rgba(244, 24, 27, 0.95);
      background: rgba(24, 24, 27, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.15);
      border-radius: 18px;
      padding: 14px 18px;
      z-index: 100;
      overflow: hidden;
    }
    .timer-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: rgba(16, 185, 129, 0.08);
      z-index: 0;
      transition: width 0.3s linear;
    }
    .timer-content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-meta {
      display: flex;
      flex-direction: column;
    }
    .timer-tag {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .timer-clock {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      margin-top: 2px;
    }
    .timer-btn-group {
      display: flex;
      gap: 8px;
    }
    .timer-action {
      background: #27272a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .timer-action-skip {
      background: #3f3f46;
      color: #d4d4d8;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
      align-items: flex-end;
      padding: 0;
    }
    .modal-sheet {
      width: 100%;
      background: #141418;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid #27272a;
      border-bottom: none;
      padding: 24px 20px 36px 20px;
      box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.5);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-grabber {
      width: 40px;
      height: 4px;
      background: #3f3f46;
      border-radius: 2px;
      margin: 0 auto 18px auto;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }
    .input-field, .select-field {
      width: 100%;
      background: #0d0d10;
      border: 1px solid #27272a;
      padding: 12px 14px;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      margin-bottom: 14px;
    }
    .input-field:focus, .select-field:focus {
      border-color: var(--primary);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-tile {
      background: #0d0d10;
      border: 1px solid #222228;
      padding: 14px;
      border-radius: 14px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
    }
    .stat-number {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-top: 4px;
    }

    .btn-ai-cta {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-ai-cta:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .ai-feedback-view {
      margin-top: 14px;
      background: #0d0d10;
      border-radius: 14px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.7;
      color: #d4d4d8;
      white-space: pre-line;
      min-height: 90px;
      border: 1px solid #222228;
      border-left: 4px solid var(--primary);
    }
    .btn-sheet-close {
      width: 100%;
      padding: 12px;
      background: #1e1e24;
      border-radius: 12px;
      color: #a1a1aa;
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
    }
    .btn-sheet-reset {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <span class="brand-title">Pro Workout Engine</span>
      <div class="header-actions">
        <button class="btn-icon" onclick="configureApiKey()">API 키</button>
        <button class="btn-finish-workout" onclick="finishWorkout()">운동 종료</button>
      </div>
    </div>

    <div class="exercise-bar">
      <div class="select-wrapper">
        <select id="exercise-picker" class="exercise-select" onchange="changeExercise(this.value)"></select>
        <span class="select-arrow">▼</span>
      </div>
      <button class="btn-manage" onclick="openExModal('edit')">수정</button>
      <button class="btn-manage" onclick="openExModal('add')">+종목</button>
    </div>

    <div class="meta-chips">
      <span id="chip-part" class="chip chip-accent"></span>
      <span id="chip-rest" class="chip"></span>
      <span id="chip-step" class="chip"></span>
    </div>
  </header>

  <main class="content">
    <div class="section-header">
      <span class="section-title">SET LOGS</span>
      <span class="section-title" id="completed-count">0 / 0 완료</span>
    </div>

    <div id="set-list"></div>

    <button class="btn-add-set" onclick="addSet()">
      <span>+</span> 세트 추가
    </button>
  </main>

  <aside id="timer-island">
    <div id="timer-progress" class="timer-progress"></div>
    <div class="timer-content">
      <div class="timer-meta">
        <span class="timer-tag">REST INTERVAL</span>
        <span id="timer-val" class="timer-clock">01:00</span>
      </div>
      <div class="timer-btn-group">
        <button class="timer-action" onclick="addTime(30)">+30s</button>
        <button class="timer-action timer-action-skip" onclick="skipTimer()">스킵</button>
      </div>
    </div>
  </aside>

  <div id="ex-modal" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-grabber"></div>
      <h2 id="ex-modal-title" class="modal-title">운동 종목 설정</h2>
      
      <label class="form-label">운동 이름</label>
      <input type="text" id="form-ex-name" class="input-field" placeholder="예: 덤벨 숄더 프레스">

      <label class="form-label">타깃 부위 (AI 밸런스 분석용)</label>
      <select id="form-ex-part" class="select-field">
        <option value="전면삼각근">전면삼각근</option>
        <option value="측면삼각근">측면삼각근</option>
        <option value="후면삼각근">후면삼각근</option>
        <option value="전면·측면 복합">전면·측면 복합 (프레스류)</option>
        <option value="기타 상체">기타 상체</option>
      </select>

      <label class="form-label">세트 간 휴식 시간</label>
      <select id="form-ex-rest" class="select-field">
        <option value="45">45초</option>
        <option value="60">60초 (기본 고립)</option>
        <option value="90">90초</option>
        <option value="120">120초 (복합 고중량)</option>
        <option value="180">180초 (스트렝스)</option>
      </select>

      <label class="form-label">중량 조절 단위 (+/-)</label>
      <select id="form-ex-step" class="select-field">
        <option value="0.5">0.5 kg (미세 증량)</option>
        <option value="1">1.0 kg (케이블/덤벨)</option>
        <option value="2">2.0 kg</option>
        <option value="2.5">2.5 kg (바벨 원판)</option>
        <option value="5">5.0 kg</option>
      </select>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <button style="flex:1; padding:14px; background:var(--primary); color:#000; border-radius:12px; font-weight:700;" onclick="saveExerciseModal()">저장 완료</button>
        <button id="btn-delete-ex" style="padding:14px; background:rgba(244,63,94,0.15); color:var(--danger); border-radius:12px; font-weight:700;" onclick="deleteCurrentExercise()">삭제</button>
      </div>
      <button class="btn-sheet-close" onclick="closeExModal()">취소</button>
    </div>
  </div>

  <div id="result-modal" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-grabber"></div>
      <h2 class="modal-title">세션 리포트 & 다음 루틴 처방</h2>

      <div class="stat-grid">
        <div class="stat-tile">
          <span class="stat-label">TOTAL VOLUME</span>
          <div id="res-volume" class="stat-number">0 kg</div>
        </div>
        <div class="stat-tile">
          <span class="stat-label">COMPLETED SETS</span>
          <div id="res-sets" class="stat-number">0 SETS</div>
        </div>
      </div>

      <button id="ai-req-btn" class="btn-ai-cta" onclick="requestAiAnalysis()">
        <span>✦</span> AI 어깨 분석 & 다음 운동 처방
      </button>

      <div id="ai-result" class="ai-feedback-view">버튼을 누르면 오늘 운동을 분석하고 다음 운동 날 수행할 종목, 중량, 횟수를 처방합니다.</div>

      <button class="btn-sheet-close" onclick="closeResultModal()">닫기</button>
      <button class="btn-sheet-reset" onclick="resetAllWorkout()">세션 완료 체크 초기화</button>
    </div>
  </div>

  <script>
    const DEFAULT_EXERCISES = {
      ohp: { name: '오버헤드 프레스', part: '전면·측면 복합', rest: 120, step: 2.5, defaultWeight: 35.0, defaultReps: 6 },
      lateral: { name: '사이드 레터럴 레이즈', part: '측면삼각근', rest: 60, step: 0.5, defaultWeight: 12.0, defaultReps: 15 },
      facepull: { name: '페이스 풀', part: '후면삼각근', rest: 60, step: 1.0, defaultWeight: 20.0, defaultReps: 12 }
    };

    const DEFAULT_SETS = {
      ohp: [
        { id: 1, weight: 35.0, reps: 6, done: false },
        { id: 2, weight: 35.0, reps: 6, done: false },
        { id: 3, weight: 35.0, reps: 5, done: false }
      ],
      lateral: [
        { id: 1, weight: 12.0, reps: 15, done: false },
        { id: 2, weight: 12.0, reps: 14, done: false },
        { id: 3, weight: 12.0, reps: 12, done: false }
      ],
      facepull: [
        { id: 1, weight: 20.0, reps: 15, done: false },
        { id: 2, weight: 20.0, reps: 15, done: false },
        { id: 3, weight: 20.0, reps: 12, done: false }
      ]
    };

    let exercises = {};
    let workoutData = {};
    let currentExKey = 'lateral';
    let modalMode = 'add';
    let timerTarget = null;
    let timerTotalSec = 60;
    let timerInterval = null;

    try {
      const savedEx = localStorage.getItem('custom_exercises_v6');
      const savedSets = localStorage.getItem('workout_sets_v6');
      exercises = savedEx ? JSON.parse(savedEx) : JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
      workoutData = savedSets ? JSON.parse(savedSets) : JSON.parse(JSON.stringify(DEFAULT_SETS));
      if (!exercises || Object.keys(exercises).length === 0) exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
    } catch (e) {
      exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
      workoutData = JSON.parse(JSON.stringify(DEFAULT_SETS));
    }

    currentExKey = Object.keys(exercises)[0];

    function save() {
      try {
        localStorage.setItem('custom_exercises_v6', JSON.stringify(exercises));
        localStorage.setItem('workout_sets_v6', JSON.stringify(workoutData));
      } catch (e) {}
    }

    function renderPicker() {
      const picker = document.getElementById('exercise-picker');
      picker.innerHTML = Object.keys(exercises).map(k => 
        `<option value="${k}" ${k === currentExKey ? 'selected' : ''}>${exercises[k].name}</option>`
      ).join('');
      const ex = exercises[currentExKey];
      document.getElementById('chip-part').innerText = ex.part;
      document.getElementById('chip-rest').innerText = `휴식 ${ex.rest}s`;
      document.getElementById('chip-step').innerText = `단위 ${ex.step}kg`;
    }

    function changeExercise(key) {
      currentExKey = key;
      renderPicker();
      render();
    }

    function openExModal(mode) {
      modalMode = mode;
      const modal = document.getElementById('ex-modal');
      const delBtn = document.getElementById('btn-delete-ex');

      if (mode === 'edit') {
        const ex = exercises[currentExKey];
        document.getElementById('ex-modal-title').innerText = '운동 설정 수정';
        document.getElementById('form-ex-name').value = ex.name;
        document.getElementById('form-ex-part').value = ex.part;
        document.getElementById('form-ex-rest').value = String(ex.rest);
        document.getElementById('form-ex-step').value = String(ex.step);
        delBtn.style.display = 'block';
      } else {
        document.getElementById('ex-modal-title').innerText = '새 운동 추가';
        document.getElementById('form-ex-name').value = '';
        document.getElementById('form-ex-part').value = '측면삼각근';
        document.getElementById('form-ex-rest').value = '60';
        document.getElementById('form-ex-step').value = '1';
        delBtn.style.display = 'none';
      }
      modal.style.display = 'flex';
    }

    function closeExModal() {
      document.getElementById('ex-modal').style.display = 'none';
    }

    function saveExerciseModal() {
      const name = document.getElementById('form-ex-name').value.trim();
      const part = document.getElementById('form-ex-part').value;
      const rest = parseInt(document.getElementById('form-ex-rest').value, 10);
      const step = parseFloat(document.getElementById('form-ex-step').value);

      if (!name) {
        alert('운동 이름을 입력하세요.');
        return;
      }

      if (modalMode === 'edit') {
        exercises[currentExKey].name = name;
        exercises[currentExKey].part = part;
        exercises[currentExKey].rest = rest;
        exercises[currentExKey].step = step;
      } else {
        const newKey = 'ex_' + Date.now();
        exercises[newKey] = { name, part, rest, step, defaultWeight: 10.0, defaultReps: 12 };
        workoutData[newKey] = [
          { id: 1, weight: 10.0, reps: 12, done: false },
          { id: 2, weight: 10.0, reps: 12, done: false },
          { id: 3, weight: 10.0, reps: 12, done: false }
        ];
        currentExKey = newKey;
      }

      save();
      renderPicker();
      render();
      closeExModal();
    }

    function deleteCurrentExercise() {
      const keys = Object.keys(exercises);
      if (keys.length <= 1) {
        alert('최소 1개 종목은 있어야 합니다.');
        return;
      }
      if (!confirm(`'${exercises[currentExKey].name}' 종목을 삭제할까요?`)) return;

      delete exercises[currentExKey];
      delete workoutData[currentExKey];
      currentExKey = Object.keys(exercises)[0];
      save();
      renderPicker();
      render();
      closeExModal();
    }

    function render() {
      if (!workoutData[currentExKey]) workoutData[currentExKey] = [];
      const sets = workoutData[currentExKey];
      const ex = exercises[currentExKey];
      const container = document.getElementById('set-list');

      const completed = sets.filter(s => s.done).length;
      document.getElementById('completed-count').innerText = `${completed} / ${sets.length} 완료`;

      container.innerHTML = sets.map((s, idx) => `
        <div class="set-card ${s.done ? 'is-done' : ''}">
          <div class="set-tag">S${idx + 1}</div>

          <div class="stepper-capsule">
            <button class="stepper-btn" onclick="updateVal(${idx}, 'weight', -${ex.step})">-</button>
            <div class="stepper-val">
              <span class="val-num">${Number(s.weight).toFixed(1)}</span>
              <span class="val-unit">KG</span>
            </div>
            <button class="stepper-btn" onclick="updateVal(${idx}, 'weight', ${ex.step})">+</button>
          </div>

          <div class="stepper-capsule">
            <button class="stepper-btn" onclick="updateVal(${idx}, 'reps', -1)">-</button>
            <div class="stepper-val">
              <span class="val-num">${s.reps}</span>
              <span class="val-unit">REPS</span>
            </div>
            <button class="stepper-btn" onclick="updateVal(${idx}, 'reps', 1)">+</button>
          </div>

          <button class="btn-complete ${s.done ? 'done' : ''}" onclick="toggleSet(${idx})">✓</button>
          <button class="btn-del" onclick="deleteSet(${idx})">✕</button>
        </div>
      `).join('');
    }

    function updateVal(idx, key, delta) {
      const sets = workoutData[currentExKey];
      if (!sets || !sets[idx] || sets[idx].done) return;
      if (key === 'weight') sets[idx].weight = Math.max(0, parseFloat((Number(sets[idx].weight) + delta).toFixed(1)));
      if (key === 'reps') sets[idx].reps = Math.max(1, sets[idx].reps + delta);
      save();
      render();
    }

    function addSet() {
      if (!workoutData[currentExKey]) workoutData[currentExKey] = [];
      const sets = workoutData[currentExKey];
      const ex = exercises[currentExKey];
      const last = sets.length > 0 ? sets[sets.length - 1] : null;

      sets.push({
        id: Date.now(),
        weight: last ? Number(last.weight) : (ex.defaultWeight || 10.0),
        reps: last ? Number(last.reps) : (ex.defaultReps || 12),
        done: false
      });
      save();
      render();
    }

    function deleteSet(idx) {
      const sets = workoutData[currentExKey];
      if (!sets || sets.length <= 1) {
        alert('최소 1개 세트는 유지되어야 합니다.');
        return;
      }
      sets.splice(idx, 1);
      save();
      render();
    }

    function toggleSet(idx) {
      const sets = workoutData[currentExKey];
      if (!sets || !sets[idx]) return;
      sets[idx].done = !sets[idx].done;
      save();
      render();
      if (sets[idx].done) {
        if ('vibrate' in navigator) navigator.vibrate(50);
        startTimer(exercises[currentExKey].rest);
      }
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    function startTimer(sec) {
      timerTotalSec = sec;
      timerTarget = Date.now() + sec * 1000;
      document.getElementById('timer-island').style.display = 'block';
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        const remaining = Math.ceil((timerTarget - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer-island').style.display = 'none';
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200, 100, 200]);
          playBeep();
        } else {
          const m = String(Math.floor(remaining / 60)).padStart(2, '0');
          const s = String(remaining % 60).padStart(2, '0');
          document.getElementById('timer-val').innerText = `${m}:${s}`;
          
          const progressPercent = ((timerTotalSec - remaining) / timerTotalSec) * 100;
          document.getElementById('timer-progress').style.width = `${progressPercent}%`;
        }
      }, 250);
    }

    function addTime(sec) {
      if (!timerTarget) return;
      timerTarget += sec * 1000;
      timerTotalSec += sec;
    }

    function skipTimer() {
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('timer-island').style.display = 'none';
      timerTarget = null;
    }

    function finishWorkout() {
      let totalVol = 0;
      let totalCompletedSets = 0;

      Object.keys(workoutData).forEach(k => {
        if (!exercises[k]) return;
        workoutData[k].forEach(s => {
          if (s.done) {
            totalVol += (s.weight * s.reps);
            totalCompletedSets++;
          }
        });
      });

      document.getElementById('res-volume').innerText = `${totalVol.toLocaleString()} kg`;
      document.getElementById('res-sets').innerText = `${totalCompletedSets} SETS`;
      document.getElementById('result-modal').style.display = 'flex';
    }

    function closeResultModal() {
      document.getElementById('result-modal').style.display = 'none';
    }

    function resetAllWorkout() {
      if (!confirm('완료 체크를 모두 풀고 새 세션을 시작할까요?')) return;
      Object.keys(workoutData).forEach(k => {
        workoutData[k].forEach(s => s.done = false);
      });
      save();
      render();
      closeResultModal();
    }

    function configureApiKey() {
      const current = localStorage.getItem('gemini_api_key') || '';
      const key = prompt('Gemini API 키를 입력하세요 (Google AI Studio에서 발급):', current);
      if (key !== null) localStorage.setItem('gemini_api_key', key.trim());
    }

    // gemini-3.8-flash 직접 호출
    async function requestAiAnalysis() {
      const apiKey = (localStorage.getItem('gemini_api_key') || '').trim();
      const box = document.getElementById('ai-result');
      const reqBtn = document.getElementById('ai-req-btn');

      if (!apiKey) {
        alert('우측 상단 [API 키] 버튼을 눌러 Gemini API 키를 먼저 등록해주세요.');
        box.innerText = '⚠️ API 키가 등록되지 않았습니다. 상단 [API 키] 버튼을 눌러 등록해주세요.';
        return;
      }

      const summary = {};
      let totalDoneSets = 0;

      Object.keys(workoutData).forEach(k => {
        if (!exercises[k]) return;
        const done = workoutData[k].filter(s => s.done);
        if (done.length > 0) {
          const label = `${exercises[k].name} (${exercises[k].part})`;
          summary[label] = done.map(s => `${s.weight}kg x ${s.reps}회`);
          totalDoneSets += done.length;
        }
      });

      if (totalDoneSets === 0) {
        box.innerText = '⚠️ 완료(✓) 체크된 세트가 없습니다.\n운동 세트 오른쪽의 체크(✓) 버튼을 눌러 세트를 완료한 뒤 검사를 요청해주세요.';
        return;
      }

      reqBtn.disabled = true;
      reqBtn.innerText = 'AI 분석 및 처방 계산 중...';
      box.innerText = '⏳ Gemini 3.8 Flash 코치가 오늘 운동 로그를 분석하고 다음 세션의 목표치와 루틴을 작성 중입니다...';

      const promptText = `
너는 비판적이고 엄격한 근비대 전문 보디빌딩 코치다.
모호한 칭찬이나 빈말은 일체 배제하고, 사용자가 오늘 수행한 운동 로그를 바탕으로 아래 3가지 항목을 구체적인 수치(kg, 횟수, 세트수)로 명확히 작성하라.

[오늘 수행된 운동 로그]
${JSON.stringify(summary, null, 2)}

---
[답변 양식]
1. 오늘 운동 평가 & 과부하 점검:
- 오늘 운동의 세트 수와 중량이 어깨 근비대에 충분했는지 냉정하게 지적
- 전면/측면/후면 중 볼륨이 부족하거나 과도하게 치우친 부위 경고

2. 다음 운동 날 처방 (핵심):
- 다음 어깨 운동 날 반드시 해야 할 추천 종목 리스트
- 각 종목별 구체적인 [목표 시작 중량(kg)], [목표 반복 횟수(회)], [추천 세트 수]를 숫자로 정확히 제시 (예: OHP 37.5kg 6회 3세트, 사레레 12.5kg 15회 4세트 등)
- 오늘 기록과 비교해 중량을 올릴지, 횟수를 늘릴지 과부하 지침 제공

3. 휴식 및 회복 시간:
- 다음 어깨 세션까지 권장하는 회복 시간(시간 또는 며칠 뒤 추천)
`;

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await res.json();

        if (!res.ok) {
          const errDetail = data.error?.message || '알 수 없는 서버 오류';
          box.innerText = `❌ API 호출 실패 (상태 코드: ${res.status})\n오류 내용: ${errDetail}\n\n상단 [API 키]를 눌러 키를 다시 확인해주세요.`;
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          box.innerText = reply;
        } else {
          box.innerText = '⚠️ 응답 텍스트를 불러오지 못했습니다. 반환된 데이터:\n' + JSON.stringify(data);
        }
      } catch (err) {
        box.innerText = `❌ 통신/네트워크 에러:\n${err.message}\n\n스마트폰 인터넷 연결을 확인해주세요.`;
      } finally {
        reqBtn.disabled = false;
        reqBtn.innerText = '✦ AI 어깨 분석 & 다음 운동 처방';
      }
    }

    renderPicker();
    render();
  </script>
</body>
</html>
