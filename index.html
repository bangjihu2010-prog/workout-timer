<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>어깨 볼륨 & 휴식 타이머</title>
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 90px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #27272a; }
    
    .exercise-select { background: #1e1e24; color: #ffffff; border: 1px solid #3f3f46; padding: 6px 10px; border-radius: 8px; font-size: 15px; font-weight: 700; outline: none; }
    .badge { font-size: 11px; background: #27272a; color: #38bdf8; padding: 3px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; }
    
    .header-btns { display: flex; gap: 8px; }
    button { cursor: pointer; border: none; font-family: inherit; }
    .btn-sub { background: #27272a; color: #a1a1aa; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
    .btn-sub:active { background: #3f3f46; }
    .btn-finish { background: #ef4444; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
    .btn-finish:active { background: #dc2626; }

    /* 세트 테이블 */
    .table-head { display: flex; padding: 10px 16px; color: #71717a; font-size: 12px; border-bottom: 1px solid #1f1f23; }
    .col-idx { width: 40px; text-align: center; }
    .col-data { flex: 1; text-align: center; }
    .col-chk { width: 44px; text-align: center; }

    .set-row { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid #1e1e24; }
    .set-row.done { opacity: 0.45; }
    .set-num { width: 40px; text-align: center; font-size: 15px; font-weight: 600; color: #a1a1aa; }
    .stepper { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .step-btn { background: #27272a; color: #38bdf8; width: 36px; height: 36px; border-radius: 6px; font-size: 18px; font-weight: 700; }
    .step-btn:active { background: #38bdf8; color: #121212; }
    .val-text { width: 44px; text-align: center; font-size: 15px; font-weight: 600; }
    
    .chk-btn { width: 36px; height: 36px; border-radius: 8px; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-left: 8px; }
    .chk-pending { background: #27272a; border: 1px solid #3f3f46; color: transparent; }
    .chk-pending:active { background: #3f3f46; }
    .chk-done { background: #10b981; color: #fff; }

    /* 세트 추가 버튼 */
    .add-set-btn { margin: 16px; width: calc(100% - 32px); padding: 14px; background: #1e1e24; border: 1px dashed #38bdf8; border-radius: 8px; color: #38bdf8; font-size: 15px; font-weight: 700; text-align: center; display: block; }
    .add-set-btn:active { background: #38bdf8; color: #121212; }

    /* 플로팅 타이머 */
    #timer-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #18181b; border-top: 2px solid #10b981; padding: 12px 16px; justify-content: space-between; align-items: center; z-index: 10; }
    .timer-text { font-size: 24px; font-weight: 800; color: #10b981; font-variant-numeric: tabular-nums; }
    .timer-ctrls { display: flex; gap: 8px; }
    .timer-btn { background: #27272a; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
    .timer-btn:active { background: #3f3f46; }

    /* 결과 모달 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); padding: 20px; z-index: 20; overflow-y: auto; }
    .modal-box { background: #18181b; border-radius: 12px; padding: 20px; border: 1px solid #27272a; }
    .modal-box h2 { font-size: 18px; margin-bottom: 12px; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #a1a1aa; }
    .stat-val { color: #fff; font-weight: 600; }
    .ai-box { margin-top: 16px; padding: 12px; background: #121212; border-radius: 8px; font-size: 13px; line-height: 1.6; color: #e4e4e7; border-left: 3px solid #38bdf8; min-height: 80px; white-space: pre-line; }
    .close-btn { margin-top: 16px; width: 100%; padding: 12px; background: #27272a; color: #fff; border-radius: 6px; font-weight: 600; }
    .reset-btn { margin-top: 8px; width: 100%; padding: 10px; background: transparent; border: 1px solid #3f3f46; color: #ef4444; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <div>
      <select id="exercise-picker" class="exercise-select" onchange="changeExercise(this.value)">
        <option value="ohp">오버헤드 프레스</option>
        <option value="lateral" selected>사이드 레터럴 레이즈</option>
        <option value="facepull">페이스 풀</option>
      </select>
      <br>
      <span class="badge" id="ex-desc">측면삼각근 (휴식 60초 | 0.5kg 단위)</span>
    </div>
    <div class="header-btns">
      <button class="btn-sub" onclick="configureApiKey()">API 키</button>
      <button class="btn-finish" onclick="finishWorkout()">운동 종료</button>
    </div>
  </header>

  <div class="table-head">
    <div class="col-idx">세트</div>
    <div class="col-data">중량 (kg)</div>
    <div class="col-data">횟수 (회)</div>
    <div class="col-chk">완료</div>
  </div>

  <div id="set-list"></div>
  <button id="add-set-button" class="add-set-btn" onclick="addSet()">+ 세트 추가</button>

  <!-- 플로팅 타이머 -->
  <div id="timer-bar">
    <div>
      <div style="font-size: 11px; color: #a1a1aa;">휴식 중</div>
      <div id="timer-val" class="timer-text">01:00</div>
    </div>
    <div class="timer-ctrls">
      <button class="timer-btn" onclick="addTime(30)">+30초</button>
      <button class="timer-btn" style="background:#3f3f46;" onclick="skipTimer()">건너뛰기</button>
    </div>
  </div>

  <!-- 결과 모달 -->
  <div id="result-modal" class="modal">
    <div class="modal-box">
      <h2>세션 검사 리포트</h2>
      <div class="stat-row"><span>총 볼륨</span><span id="res-volume" class="stat-val">0 kg</span></div>
      <div class="stat-row"><span>완료 세트</span><span id="res-sets" class="stat-val">0 세트</span></div>
      
      <button id="ai-req-btn" style="width:100%; margin-top:12px; padding:12px; background:#2563eb; color:#fff; border-radius:6px; font-weight:700;" onclick="requestAiAnalysis()">AI 코칭 검사 받기</button>
      
      <div id="ai-result" class="ai-box">운동 기록을 기반으로 점진적 과부하와 어깨 밸런스를 분석합니다.</div>
      <button class="close-btn" onclick="document.getElementById('result-modal').style.display='none'">닫기</button>
      <button class="reset-btn" onclick="resetAllWorkout()">새 운동으로 초기화 (세트 체크 풀기)</button>
    </div>
  </div>

  <script>
    const EXERCISES = {
      ohp: { name: '오버헤드 프레스', part: '전면·측면삼각근 (근력 축)', rest: 120, step: 2.5, defaultWeight: 35.0, defaultReps: 6 },
      lateral: { name: '사이드 레터럴 레이즈', part: '측면삼각근 (프레임 너비)', rest: 60, step: 0.5, defaultWeight: 12.0, defaultReps: 15 },
      facepull: { name: '페이스 풀', part: '후면삼각근 & 회전근개', rest: 60, step: 1.0, defaultWeight: 20.0, defaultReps: 12 }
    };

    function getDefaultData() {
      return {
        ohp: [
          { id: 1, weight: 35.0, reps: 6, done: false },
          { id: 2, weight: 35.0, reps: 6, done: false },
          { id: 3, weight: 35.0, reps: 5, done: false }
        ],
        lateral: [
          { id: 1, weight: 12.0, reps: 15, done: false },
          { id: 2, weight: 12.0, reps: 14, done: false },
          { id: 3, weight: 12.0, reps: 12, done: false }
        ],
        facepull: [
          { id: 1, weight: 20.0, reps: 15, done: false },
          { id: 2, weight: 20.0, reps: 15, done: false },
          { id: 3, weight: 20.0, reps: 12, done: false }
        ]
      };
    }

    // 로컬 스토리지 충돌 방어 로드
    let workoutData;
    try {
      const stored = localStorage.getItem('workout_data_v3');
      workoutData = stored ? JSON.parse(stored) : getDefaultData();
      if (!workoutData || !workoutData.lateral || !Array.isArray(workoutData.lateral)) {
        workoutData = getDefaultData();
      }
    } catch (e) {
      workoutData = getDefaultData();
    }

    let currentExKey = 'lateral';
    let timerTarget = null;
    let timerInterval = null;

    function save() {
      try {
        localStorage.setItem('workout_data_v3', JSON.stringify(workoutData));
      } catch (e) {}
    }

    function changeExercise(key) {
      currentExKey = key;
      const ex = EXERCISES[key];
      document.getElementById('ex-desc').innerText = `${ex.part} (휴식 ${ex.rest}초 | ${ex.step}kg 단위)`;
      render();
    }

    function render() {
      if (!workoutData[currentExKey]) workoutData[currentExKey] = [];
      const sets = workoutData[currentExKey];
      const ex = EXERCISES[currentExKey];
      const container = document.getElementById('set-list');

      container.innerHTML = sets.map((s, idx) => `
        <div class="set-row ${s.done ? 'done' : ''}">
          <div class="set-num">${idx + 1}</div>
          <div class="stepper">
            <button class="step-btn" onclick="updateVal(${idx}, 'weight', -${ex.step})">-</button>
            <span class="val-text">${Number(s.weight).toFixed(1)}</span>
            <button class="step-btn" onclick="updateVal(${idx}, 'weight', ${ex.step})">+</button>
          </div>
          <div class="stepper">
            <button class="step-btn" onclick="updateVal(${idx}, 'reps', -1)">-</button>
            <span class="val-text">${s.reps}</span>
            <button class="step-btn" onclick="updateVal(${idx}, 'reps', 1)">+</button>
          </div>
          <div class="chk-btn ${s.done ? 'chk-done' : 'chk-pending'}" onclick="toggleSet(${idx})">
            ${s.done ? '✓' : ''}
          </div>
        </div>
      `).join('');
    }

    function updateVal(idx, key, delta) {
      const sets = workoutData[currentExKey];
      if (!sets || !sets[idx] || sets[idx].done) return;
      if (key === 'weight') sets[idx].weight = Math.max(0, parseFloat((Number(sets[idx].weight) + delta).toFixed(1)));
      if (key === 'reps') sets[idx].reps = Math.max(1, sets[idx].reps + delta);
      save();
      render();
    }

    // 세트 추가 함수 (에러 방어 처리)
    function addSet() {
      if (!workoutData[currentExKey]) workoutData[currentExKey] = [];
      const sets = workoutData[currentExKey];
      const ex = EXERCISES[currentExKey];
      const last = sets.length > 0 ? sets[sets.length - 1] : null;

      sets.push({
        id: Date.now(),
        weight: last ? Number(last.weight) : ex.defaultWeight,
        reps: last ? Number(last.reps) : ex.defaultReps,
        done: false
      });
      save();
      render();
    }

    function toggleSet(idx) {
      const sets = workoutData[currentExKey];
      if (!sets || !sets[idx]) return;
      sets[idx].done = !sets[idx].done;
      save();
      render();
      if (sets[idx].done) {
        if ('vibrate' in navigator) navigator.vibrate(50);
        startTimer(EXERCISES[currentExKey].rest);
      }
    }

    // 아이폰에서도 소리 나도록 Web Audio API 내장
    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    function startTimer(sec) {
      timerTarget = Date.now() + sec * 1000;
      document.getElementById('timer-bar').style.display = 'flex';
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        const remaining = Math.ceil((timerTarget - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer-bar').style.display = 'none';
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200, 100, 200]);
          playBeep();
        } else {
          const m = String(Math.floor(remaining / 60)).padStart(2, '0');
          const s = String(remaining % 60).padStart(2, '0');
          document.getElementById('timer-val').innerText = `${m}:${s}`;
        }
      }, 250);
    }

    function addTime(sec) {
      if (!timerTarget) return;
      timerTarget += sec * 1000;
    }

    function skipTimer() {
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('timer-bar').style.display = 'none';
      timerTarget = null;
    }

    function finishWorkout() {
      let totalVol = 0;
      let totalCompletedSets = 0;

      Object.keys(workoutData).forEach(k => {
        workoutData[k].forEach(s => {
          if (s.done) {
            totalVol += (s.weight * s.reps);
            totalCompletedSets++;
          }
        });
      });

      document.getElementById('res-volume').innerText = `${totalVol.toLocaleString()} kg`;
      document.getElementById('res-sets').innerText = `${totalCompletedSets} 세트`;
      document.getElementById('result-modal').style.display = 'block';
    }

    function resetAllWorkout() {
      if (!confirm('완료 체크를 모두 풀고 새 세션을 시작할까요? (중량/횟수 수치는 유지됩니다)')) return;
      Object.keys(workoutData).forEach(k => {
        workoutData[k].forEach(s => s.done = false);
      });
      save();
      render();
      document.getElementById('result-modal').style.display = 'none';
    }

    function configureApiKey() {
      const current = localStorage.getItem('gemini_api_key') || '';
      const key = prompt('Gemini API 키를 입력하세요:', current);
      if (key !== null) localStorage.setItem('gemini_api_key', key.trim());
    }

    async function requestAiAnalysis() {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        alert('우측 상단 [API 키] 버튼을 눌러 먼저 Gemini API 키를 등록하세요.');
        return;
      }

      const summary = {};
      Object.keys(workoutData).forEach(k => {
        const done = workoutData[k].filter(s => s.done);
        if (done.length > 0) {
          summary[EXERCISES[k].name] = done.map(s => `${s.weight}kg x ${s.reps}회`);
        }
      });

      const box = document.getElementById('ai-result');
      const reqBtn = document.getElementById('ai-req-btn');
      reqBtn.disabled = true;
      box.innerText = 'AI가 어깨 전·측·후면 볼륨 밸런스를 점검 중입니다...';

      const promptText = `
너는 엄격한 근비대 전문 보디빌딩 코치다. 모호한 응원이나 미사여구는 배제하고 다음 3가지 지표를 분석하라:
1. 어깨 3면 밸런스 점검: 전면(OHP), 측면(사레레), 후면(페이스풀) 중 볼륨이 부족하거나 치우친 부위 경고
2. 과부하 달성도 평가: 각 종목별 반복수/중량 조합의 적절성
3. 다음 세션 핵심 처방: 다음 루틴에서 우선적으로 올려야 할 종목과 구체적인 중량/횟수 목표

[오늘 수행된 운동 로그]
${JSON.stringify(summary, null, 2)}
`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });
        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        box.innerText = reply || '피드백 응답을 가져오지 못했습니다.';
      } catch (err) {
        box.innerText = '통신 에러 발생: ' + err.message;
      } finally {
        reqBtn.disabled = false;
      }
    }

    changeExercise('lateral');
  </script>
</body>
</html>
