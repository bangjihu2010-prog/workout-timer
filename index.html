<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PRO IRON - 스포츠 과학 기반 트레이닝 엔진</title>
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PRO IRON">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #141418;
      --card-border: #27272a;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.22);
      --primary: #38bdf8;
      --text-main: #f4f4f5;
      --text-sub: #71717a;
      --danger: #f43f5e;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 130px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font-family: inherit;
      border: none;
      outline: none;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.12s ease;
    }
    button:active {
      transform: scale(0.95);
    }

    /* 상단 헤더 */
    header {
      padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 16px 20px;
      background: rgba(9, 9, 11, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: var(--text-sub);
      text-transform: uppercase;
    }
    .wake-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3f3f46;
      display: inline-block;
    }
    .wake-dot.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-util {
      background: #18181b;
      color: #a1a1aa;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #27272a;
    }
    .btn-finish-workout {
      background: rgba(244, 63, 94, 0.15);
      color: var(--danger);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    /* 종목 선택 바 */
    .exercise-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .select-wrapper {
      position: relative;
      flex: 1;
    }
    .exercise-select {
      width: 100%;
      background: #18181b;
      color: #fff;
      border: 1px solid #2e2e38;
      padding: 11px 32px 11px 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      appearance: none;
      outline: none;
    }
    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: var(--text-sub);
      pointer-events: none;
    }
    .btn-manage {
      background: #18181b;
      color: var(--primary);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #2e2e38;
      white-space: nowrap;
    }

    .meta-chips {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .chip {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #18181b;
      color: #a1a1aa;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .chip-accent {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.2);
    }

    /* 세트 리스트 */
    .content {
      padding: 16px 20px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .set-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
      transition: opacity 0.15s ease, border-color 0.15s ease;
    }
    .set-card.is-done {
      background: #0f0f13;
      border-color: rgba(16, 185, 129, 0.25);
      opacity: 0.55;
    }

    .set-tag {
      font-size: 13px;
      font-weight: 800;
      color: #52525b;
      min-width: 24px;
      text-align: center;
    }
    .set-card.is-done .set-tag {
      color: var(--accent);
    }

    .stepper-capsule {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d0d10;
      border: 1px solid #222228;
      border-radius: 10px;
      padding: 4px;
    }
    .stepper-btn {
      width: 32px;
      height: 34px;
      border-radius: 8px;
      background: #1c1c22;
      color: #e4e4e7;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .stepper-btn:active {
      background: var(--primary);
      color: #000;
    }
    .stepper-val {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      padding: 2px 4px;
      border-radius: 6px;
      cursor: pointer;
    }
    .stepper-val:active {
      background: rgba(56, 189, 248, 0.12);
    }
    .val-num {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.2);
    }
    .val-unit {
      font-size: 9px;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 1px;
    }

    .btn-complete {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #1c1c22;
      border: 1px solid #2e2e38;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .btn-complete.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .btn-del {
      background: transparent;
      color: #52525b;
      font-size: 15px;
      padding: 6px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .btn-del:active {
      color: var(--danger);
    }

    .btn-add-set {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.06);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    /* 플로팅 타이머 */
    #timer-island {
      display: none;
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 16px;
      right: 16px;
      background: rgba(24, 24, 27, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.45);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 0 20px rgba(16, 185, 129, 0.15);
      border-radius: 18px;
      padding: 14px 16px;
      z-index: 100;
      overflow: hidden;
    }
    .timer-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: rgba(16, 185, 129, 0.1);
      z-index: 0;
      transition: width 0.2s linear;
    }
    .timer-content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-meta {
      display: flex;
      flex-direction: column;
    }
    .timer-tag {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .timer-clock {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      margin-top: 2px;
    }
    .timer-btn-group {
      display: flex;
      gap: 6px;
    }
    .timer-action {
      background: #27272a;
      color: #fff;
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .timer-action-skip {
      background: #3f3f46;
      color: #e4e4e7;
    }

    /* 모달 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      align-items: flex-end;
      padding: 0;
    }
    .modal-sheet {
      width: 100%;
      background: #141418;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid #27272a;
      border-bottom: none;
      padding: 20px 20px calc(32px + env(safe-area-inset-bottom, 0px)) 20px;
      box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.5);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-grabber {
      width: 40px;
      height: 4px;
      background: #3f3f46;
      border-radius: 2px;
      margin: 0 auto 16px auto;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }
    .input-field, .select-field, .textarea-field {
      width: 100%;
      background: #0d0d10;
      border: 1px solid #27272a;
      padding: 12px 14px;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      margin-bottom: 14px;
      font-family: inherit;
    }
    .input-field:focus, .select-field:focus, .textarea-field:focus {
      border-color: var(--primary);
    }

    .direct-input-display {
      width: 100%;
      background: #09090b;
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 14px;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }
    .quick-preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn-preset {
      background: #1e1e24;
      border: 1px solid #2e2e38;
      color: #e4e4e7;
      padding: 10px 6px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .btn-preset:active {
      background: var(--primary);
      color: #000;
    }

    .stat-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-tile {
      background: #0d0d10;
      border: 1px solid #222228;
      padding: 12px 10px;
      border-radius: 14px;
      text-align: center;
    }
    .stat-label {
      font-size: 10px;
      color: var(--text-sub);
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    .stat-number {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .prescription-card {
      background: #0d0d10;
      border: 1px solid #222228;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--accent);
    }
    .prescription-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .prescription-body {
      font-size: 13px;
      line-height: 1.65;
      color: #d4d4d8;
      white-space: pre-line;
    }

    .action-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-primary-full {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      background: var(--primary);
      color: #000;
      font-size: 14px;
      font-weight: 800;
    }
    .btn-copy-prompt {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .btn-copy-prompt:active {
      background: var(--primary);
      color: #000;
    }
    .btn-sheet-close {
      width: 100%;
      padding: 12px;
      background: #1e1e24;
      border-radius: 12px;
      color: #a1a1aa;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
    }
    .btn-sheet-reset {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand-group">
        <span id="wake-indicator" class="wake-dot" title="화면 켜짐 유지 상태"></span>
        <span class="brand-title">Pro Iron Science</span>
      </div>
      <div class="header-actions">
        <button class="btn-util" onclick="openBackupModal()">백업/복원</button>
        <button class="btn-finish-workout" onclick="finishWorkout()">운동 종료 & 처방</button>
      </div>
    </div>

    <div class="exercise-bar">
      <div class="select-wrapper">
        <select id="exercise-picker" class="exercise-select" onchange="changeExercise(this.value)"></select>
        <span class="select-arrow">▼</span>
      </div>
      <button class="btn-manage" onclick="openExModal('edit')">수정</button>
      <button class="btn-manage" onclick="openExModal('add')">+종목</button>
    </div>

    <div class="meta-chips">
      <span id="chip-part" class="chip chip-accent"></span>
      <span id="chip-target" class="chip"></span>
      <span id="chip-rest" class="chip"></span>
      <span id="chip-step" class="chip"></span>
    </div>
  </header>

  <main class="content">
    <div class="section-header">
      <span class="section-title">SET LOGS (숫자 탭하여 직접 입력)</span>
      <span class="section-title" id="completed-count">0 / 0 완료</span>
    </div>

    <div id="set-list"></div>

    <button class="btn-add-set" onclick="addSet()">
      <span>+</span> 직전 세트 복제 추가
    </button>
  </main>

  <!-- 플로팅 아일랜드 타이머 -->
  <aside id="timer-island">
    <div id="timer-progress" class="timer-progress"></div>
    <div class="timer-content">
      <div class="timer-meta">
        <span class="timer-tag">REST INTERVAL</span>
        <span id="timer-val" class="timer-clock">01:00</span>
      </div>
      <div class="timer-btn-group">
        <button class="timer-action" onclick="addTime(-10)">-10s</button>
        <button class="timer-action" onclick="addTime(10)">+10s</button>
        <button class="timer-action" onclick="addTime(30)">+30s</button>
        <button class="timer-action timer-action-skip" onclick="skipTimer()">스킵</button>
      </div>
    </div>
  </aside>

  <!-- 직접 숫자 입력 모달 -->
  <div id="direct-input-modal" class="modal-backdrop" onclick="if(event.target===this) closeDirectInput()">
    <div class="modal-sheet">
      <div class="modal-grabber"></div>
      <h2 id="direct-input-title" class="modal-title">수치 직접 입력</h2>
      <input type="number" id="direct-input-field" class="direct-input-display" inputmode="decimal" step="any">
      <div id="direct-preset-container" class="quick-preset-grid"></div>
      <div class="action-btn-row">
        <button class="btn-primary-full" onclick="applyDirectInput()">적용하기</button>
      </div>
      <button class="btn-sheet-close" onclick="closeDirectInput()">취소</button>
    </div>
  </div>

  <!-- 종목 설정 모달 -->
  <div id="ex-modal" class="modal-backdrop" onclick="if(event.target===this) closeExModal()">
    <div class="modal-sheet">
      <div class="modal-grabber"></div>
      <h2 id="ex-modal-title" class="modal-title">운동 종목 설정</h2>

      <label class="form-label">운동 이름</label>
      <input type="text" id="form-ex-name" class="input-field" placeholder="예: 중량 풀업">

      <label class="form-label">타깃 부위 (스포츠 과학 밸런스 분석용)</label>
      <select id="form-ex-part" class="select-field">
        <option value="가슴 & 전면삼각근">가슴 & 전면삼각근 (푸쉬업류)</option>
        <option value="가슴 & 삼두근">가슴 & 삼두근 (다이아몬드/딥스)</option>
        <option value="광배근 & 상체 프레임">광배근 & 상체 프레임 (풀업/친업)</option>
        <option value="어깨 삼각근">어깨 삼각근 (파이크 푸쉬업/사레레/OHP)</option>
        <option value="하체 대퇴 & 둔근">하체 대퇴 & 둔근 (스쿼트)</option>
        <option value="복직근 & 코어">복직근 & 코어 (크런치/레그레이즈)</option>
        <option value="기타 전신">기타 전신</option>
      </select>

      <div class="form-row-2">
        <div>
          <label class="form-label">과부하 목표 횟수 (회)</label>
          <input type="number" id="form-ex-target" class="input-field" inputmode="numeric" placeholder="예: 12">
        </div>
        <div>
          <label class="form-label">중량 증감 단위 (+/-)</label>
          <select id="form-ex-step" class="select-field">
            <option value="0.5">0.5 kg</option>
            <option value="1">1.0 kg</option>
            <option value="2">2.0 kg</option>
            <option value="2.5">2.5 kg</option>
            <option value="5">5.0 kg</option>
          </select>
        </div>
      </div>

      <label class="form-label">세트 간 기본 휴식 시간 (다관절 90~120s / 고립 60s)</label>
      <select id="form-ex-rest" class="select-field">
        <option value="30">30초 (짧은 맨몸 인터벌)</option>
        <option value="45">45초 (기본 코어)</option>
        <option value="60">60초 (단일관절 고립/푸쉬업)</option>
        <option value="90">90초 (철봉/복합 운동 최적)</option>
        <option value="120">120초 (고중량 다관절 스트렝스)</option>
        <option value="180">180초 (최대 근력)</option>
      </select>

      <div class="action-btn-row">
        <button class="btn-primary-full" onclick="saveExerciseModal()">저장 완료</button>
        <button id="btn-delete-ex" style="padding:14px 18px; background:rgba(244,63,94,0.15); color:var(--danger); border-radius:12px; font-weight:700;" onclick="deleteCurrentExercise()">삭제</button>
      </div>
      <button class="btn-sheet-close" onclick="closeExModal()">취소</button>
    </div>
  </div>

  <!-- 데이터 백업/복원 모달 -->
  <div id="backup-modal" class="modal-backdrop" onclick="if(event.target===this) closeBackupModal()">
    <div class="modal-sheet">
      <div class="modal-grabber"></div>
      <h2 class="modal-title">데이터 백업 및 복원 (JSON)</h2>
      <label class="form-label">현재 운동 설정 및 세트 기록 데이터</label>
      <textarea id="backup-json-area" class="textarea-field" rows="5" placeholder="백업 코드를 붙여넣거나 파일로 내보내기/불러오기를 실행하세요."></textarea>

      <div class="action-btn-row">
        <button class="btn-copy-prompt" onclick="downloadBackupFile()">💾 파일로 저장</button>
        <button class="btn-copy-prompt" onclick="copyBackupText()">📋 텍스트 복사</button>
      </div>
      <div class="action-btn-row">
        <button class="btn-primary-full" onclick="restoreFromText()">🔄 위 텍스트로 데이터 복원</button>
        <label style="flex:1; padding:14px; border-radius:12px; background:#27272a; border:1px solid #3f3f46; color:#fff; font-size:13px; font-weight:700; text-align:center; cursor:pointer;">
          📂 파일 불러오기
          <input type="file" accept=".json,application/json" style="display:none;" onchange="uploadBackupFile(event)">
        </label>
      </div>
      <button class="btn-sheet-close" onclick="closeBackupModal()">닫기</button>
    </div>
  </div>

  <!-- 결과 및 스포츠 과학 처방 모달 -->
  <div id="result-modal" class="modal-backdrop" onclick="if(event.target===this) closeResultModal()">
    <div class="modal-sheet">
      <div class="modal-grabber"></div>
      <h2 class="modal-title">스포츠 과학 기반 세션 분석 리포트</h2>

      <div class="stat-grid-3">
        <div class="stat-tile">
          <span class="stat-label">TOTAL REPS</span>
          <div id="res-reps" class="stat-number">0 회</div>
        </div>
        <div class="stat-tile">
          <span class="stat-label">ADDED VOL</span>
          <div id="res-volume" class="stat-number">0 kg</div>
        </div>
        <div class="stat-tile">
          <span class="stat-label">COMPLETED</span>
          <div id="res-sets" class="stat-number">0 SETS</div>
        </div>
      </div>

      <div class="prescription-card">
        <div class="prescription-title">🎯 점진적 과부하 달성도 (Double Progression)</div>
        <div id="presc-targets" class="prescription-body"></div>
      </div>

      <div class="prescription-card" style="border-left-color: var(--primary);">
        <div class="prescription-title" style="color: var(--primary);">⚖️ 유효 볼륨 판정 & 구조 밸런스 (Sports Science)</div>
        <div id="presc-balance" class="prescription-body"></div>
      </div>

      <div class="action-btn-row">
        <button class="btn-copy-prompt" onclick="copyWorkoutPrompt()">📋 논문 분석용 상세 프롬프트 복사</button>
      </div>

      <button class="btn-sheet-close" onclick="closeResultModal()">닫기</button>
      <button class="btn-sheet-reset" onclick="resetAllWorkout()">세션 완료 체크 초기화 (새 운동 시작)</button>
    </div>
  </div>

  <script>
    /* =========================================
       1. 프리셋 데이터 & 무결성 보정
       ========================================= */
    const DEFAULT_EXERCISES = {
      pushup: { name: '푸쉬업 (팔굽혀펴기)', part: '가슴 & 전면삼각근', rest: 60, step: 0.5, defaultWeight: 0.0, defaultReps: 15, targetReps: 20 },
      knee_pushup: { name: '니 푸쉬업 (무릎 대고)', part: '가슴 & 전면삼각근', rest: 45, step: 0.5, defaultWeight: 0.0, defaultReps: 15, targetReps: 20 },
      diamond_pushup: { name: '다이아몬드 푸쉬업', part: '가슴 & 삼두근', rest: 60, step: 0.5, defaultWeight: 0.0, defaultReps: 10, targetReps: 12 },
      decline_pushup: { name: '디클라인 푸쉬업', part: '어깨 삼각근', rest: 60, step: 0.5, defaultWeight: 0.0, defaultReps: 12, targetReps: 15 },
      squat: { name: '맨몸 스쿼트', part: '하체 대퇴 & 둔근', rest: 60, step: 1.0, defaultWeight: 0.0, defaultReps: 20, targetReps: 25 },
      crunch: { name: '크런치 (복근)', part: '복직근 & 코어', rest: 45, step: 0.5, defaultWeight: 0.0, defaultReps: 20, targetReps: 25 },
      pullup: { name: '풀업 (턱걸이)', part: '광배근 & 상체 프레임', rest: 90, step: 1.0, defaultWeight: 0.0, defaultReps: 8, targetReps: 10 },
      chinup: { name: '친업 (언더그립)', part: '광배근 & 상체 프레임', rest: 90, step: 1.0, defaultWeight: 0.0, defaultReps: 8, targetReps: 10 },
      dips: { name: '딥스 (평행봉)', part: '가슴 & 삼두근', rest: 90, step: 1.0, defaultWeight: 0.0, defaultReps: 10, targetReps: 12 },
      hanging_legraise: { name: '행잉 레그레이즈', part: '복직근 & 코어', rest: 60, step: 0.5, defaultWeight: 0.0, defaultReps: 12, targetReps: 15 },
      ohp: { name: '오버헤드 프레스', part: '어깨 삼각근', rest: 120, step: 2.5, defaultWeight: 35.0, defaultReps: 6, targetReps: 8 },
      lateral: { name: '사이드 레터럴 레이즈', part: '어깨 삼각근', rest: 60, step: 0.5, defaultWeight: 12.0, defaultReps: 15, targetReps: 15 },
      facepull: { name: '페이스 풀', part: '어깨 삼각근', rest: 60, step: 1.0, defaultWeight: 20.0, defaultReps: 12, targetReps: 15 }
    };

    const DEFAULT_SETS = {
      pushup: [{ id: 1, weight: 0.0, reps: 15, done: false }, { id: 2, weight: 0.0, reps: 15, done: false }, { id: 3, weight: 0.0, reps: 12, done: false }],
      knee_pushup: [{ id: 1, weight: 0.0, reps: 15, done: false }, { id: 2, weight: 0.0, reps: 15, done: false }, { id: 3, weight: 0.0, reps: 15, done: false }],
      diamond_pushup: [{ id: 1, weight: 0.0, reps: 10, done: false }, { id: 2, weight: 0.0, reps: 10, done: false }, { id: 3, weight: 0.0, reps: 8, done: false }],
      decline_pushup: [{ id: 1, weight: 0.0, reps: 12, done: false }, { id: 2, weight: 0.0, reps: 12, done: false }, { id: 3, weight: 0.0, reps: 10, done: false }],
      squat: [{ id: 1, weight: 0.0, reps: 20, done: false }, { id: 2, weight: 0.0, reps: 20, done: false }, { id: 3, weight: 0.0, reps: 20, done: false }],
      crunch: [{ id: 1, weight: 0.0, reps: 20, done: false }, { id: 2, weight: 0.0, reps: 20, done: false }, { id: 3, weight: 0.0, reps: 15, done: false }],
      pullup: [{ id: 1, weight: 0.0, reps: 8, done: false }, { id: 2, weight: 0.0, reps: 7, done: false }, { id: 3, weight: 0.0, reps: 6, done: false }],
      chinup: [{ id: 1, weight: 0.0, reps: 8, done: false }, { id: 2, weight: 0.0, reps: 7, done: false }, { id: 3, weight: 0.0, reps: 6, done: false }],
      dips: [{ id: 1, weight: 0.0, reps: 10, done: false }, { id: 2, weight: 0.0, reps: 10, done: false }, { id: 3, weight: 0.0, reps: 8, done: false }],
      hanging_legraise: [{ id: 1, weight: 0.0, reps: 12, done: false }, { id: 2, weight: 0.0, reps: 12, done: false }, { id: 3, weight: 0.0, reps: 10, done: false }],
      ohp: [{ id: 1, weight: 35.0, reps: 6, done: false }, { id: 2, weight: 35.0, reps: 6, done: false }, { id: 3, weight: 35.0, reps: 5, done: false }],
      lateral: [{ id: 1, weight: 12.0, reps: 15, done: false }, { id: 2, weight: 12.0, reps: 14, done: false }, { id: 3, weight: 12.0, reps: 12, done: false }],
      facepull: [{ id: 1, weight: 20.0, reps: 15, done: false }, { id: 2, weight: 20.0, reps: 15, done: false }, { id: 3, weight: 20.0, reps: 12, done: false }]
    };

    const STORAGE_EX_KEY = 'custom_exercises_v10';
    const STORAGE_SETS_KEY = 'workout_sets_v10';

    let exercises = {};
    let workoutData = {};
    let currentExKey = 'pushup';
    let modalMode = 'add';
    let directEditTarget = { idx: null, key: null };

    let timerTarget = null;
    let timerTotalSec = 60;
    let timerInterval = null;

    function loadStorageData() {
      try {
        const savedEx = localStorage.getItem(STORAGE_EX_KEY);
        const savedSets = localStorage.getItem(STORAGE_SETS_KEY);
        exercises = savedEx ? JSON.parse(savedEx) : JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
        workoutData = savedSets ? JSON.parse(savedSets) : JSON.parse(JSON.stringify(DEFAULT_SETS));

        if (!exercises || typeof exercises !== 'object' || Object.keys(exercises).length === 0) {
          exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
        }
        Object.keys(exercises).forEach(k => {
          if (!exercises[k].targetReps) exercises[k].targetReps = exercises[k].defaultReps || 12;
          if (!Array.isArray(workoutData[k]) || workoutData[k].length === 0) {
            workoutData[k] = [{ id: Date.now(), weight: exercises[k].defaultWeight || 0, reps: exercises[k].defaultReps || 12, done: false }];
          }
        });
      } catch (e) {
        exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
        workoutData = JSON.parse(JSON.stringify(DEFAULT_SETS));
      }
      currentExKey = Object.keys(exercises)[0];
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_EX_KEY, JSON.stringify(exercises));
        localStorage.setItem(STORAGE_SETS_KEY, JSON.stringify(workoutData));
      } catch (e) {}
    }

    /* =========================================
       2. 오디오 언락 & Screen Wake Lock
       ========================================= */
    let sharedAudioCtx = null;
    let audioUnlocked = false;

    function initAndUnlockAudio() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!sharedAudioCtx) sharedAudioCtx = new AudioContextClass();
        if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();

        if (!audioUnlocked) {
          const buffer = sharedAudioCtx.createBuffer(1, 1, 22050);
          const source = sharedAudioCtx.createBufferSource();
          source.buffer = buffer;
          source.connect(sharedAudioCtx.destination);
          source.start(0);
          audioUnlocked = true;
        }
      } catch (e) {}
    }

    function playBeep() {
      try {
        initAndUnlockAudio();
        if (!sharedAudioCtx) return;
        const now = sharedAudioCtx.currentTime;
        [0, 0.22].forEach(offset => {
          const osc = sharedAudioCtx.createOscillator();
          const gain = sharedAudioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now + offset);
          osc.frequency.setValueAtTime(1046.5, now + offset + 0.08);
          gain.gain.setValueAtTime(0.18, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.18);
          osc.connect(gain);
          gain.connect(sharedAudioCtx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.19);
        });
      } catch (e) {}
    }

    let wakeLockSentinel = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        document.getElementById('wake-indicator').classList.add('active');
        wakeLockSentinel.addEventListener('release', () => {
          document.getElementById('wake-indicator').classList.remove('active');
        });
      } catch (e) {}
    }

    window.addEventListener('touchstart', () => {
      initAndUnlockAudio();
      if (!wakeLockSentinel) requestWakeLock();
    }, { once: true, passive: true });

    window.addEventListener('click', () => {
      initAndUnlockAudio();
      if (!wakeLockSentinel) requestWakeLock();
    }, { once: true });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        requestWakeLock();
        if (timerTarget) syncTimerUI();
      }
    });

    /* =========================================
       3. UI 렌더링 & 세트 조작
       ========================================= */
    function renderPicker() {
      const picker = document.getElementById('exercise-picker');
      picker.innerHTML = Object.keys(exercises).map(k =>
        `<option value="${k}" ${k === currentExKey ? 'selected' : ''}>${exercises[k].name}</option>`
      ).join('');
      const ex = exercises[currentExKey];
      document.getElementById('chip-part').innerText = ex.part;
      document.getElementById('chip-target').innerText = `목표 ${ex.targetReps || 12}회`;
      document.getElementById('chip-rest').innerText = `휴식 ${ex.rest}s`;
      document.getElementById('chip-step').innerText = `단위 ${ex.step}kg`;
    }

    function changeExercise(key) {
      currentExKey = key;
      renderPicker();
      render();
    }

    function render() {
      if (!workoutData[currentExKey]) workoutData[currentExKey] = [];
      const sets = workoutData[currentExKey];
      const ex = exercises[currentExKey];
      const container = document.getElementById('set-list');

      const completed = sets.filter(s => s.done).length;
      document.getElementById('completed-count').innerText = `${completed} / ${sets.length} 완료`;

      container.innerHTML = sets.map((s, idx) => `
        <div class="set-card ${s.done ? 'is-done' : ''}">
          <div class="set-tag">S${idx + 1}</div>

          <div class="stepper-capsule">
            <button class="stepper-btn" onclick="updateVal(${idx}, 'weight', -${ex.step})">-</button>
            <div class="stepper-val" onclick="openDirectInput(${idx}, 'weight')" title="탭하여 직접 입력">
              <span class="val-num">${Number(s.weight) === 0 ? '맨몸' : Number(s.weight).toFixed(1)}</span>
              <span class="val-unit">${Number(s.weight) === 0 ? 'BODY' : 'KG'}</span>
            </div>
            <button class="stepper-btn" onclick="updateVal(${idx}, 'weight', ${ex.step})">+</button>
          </div>

          <div class="stepper-capsule">
            <button class="stepper-btn" onclick="updateVal(${idx}, 'reps', -1)">-</button>
            <div class="stepper-val" onclick="openDirectInput(${idx}, 'reps')" title="탭하여 직접 입력">
              <span class="val-num">${s.reps}</span>
              <span class="val-unit">REPS</span>
            </div>
            <button class="stepper-btn" onclick="updateVal(${idx}, 'reps', 1)">+</button>
          </div>

          <button class="btn-complete ${s.done ? 'done' : ''}" onclick="toggleSet(${idx})">✓</button>
          <button class="btn-del" onclick="deleteSet(${idx})">✕</button>
        </div>
      `).join('');
    }

    function updateVal(idx, key, delta) {
      const sets = workoutData[currentExKey];
      if (!sets || !sets[idx]) return;
      if (key === 'weight') {
        sets[idx].weight = Math.max(0, parseFloat((Number(sets[idx].weight) + delta).toFixed(1)));
      }
      if (key === 'reps') {
        sets[idx].reps = Math.max(1, parseInt(sets[idx].reps, 10) + delta);
      }
      save();
      render();
    }

    function addSet() {
      if (!workoutData[currentExKey]) workoutData[currentExKey] = [];
      const sets = workoutData[currentExKey];
      const ex = exercises[currentExKey];
      const last = sets.length > 0 ? sets[sets.length - 1] : null;

      sets.push({
        id: Date.now(),
        weight: last ? Number(last.weight) : (ex.defaultWeight || 0.0),
        reps: last ? Number(last.reps) : (ex.defaultReps || 15),
        done: false
      });
      if ('vibrate' in navigator) navigator.vibrate(25);
      save();
      render();
    }

    function deleteSet(idx) {
      const sets = workoutData[currentExKey];
      if (!sets || sets.length <= 1) {
        alert('최소 1개 세트는 유지되어야 합니다.');
        return;
      }
      sets.splice(idx, 1);
      save();
      render();
    }

    function toggleSet(idx) {
      const sets = workoutData[currentExKey];
      if (!sets || !sets[idx]) return;
      sets[idx].done = !sets[idx].done;
      save();
      render();
      if (sets[idx].done) {
        if ('vibrate' in navigator) navigator.vibrate(50);
        startTimer(exercises[currentExKey].rest);
      }
    }

    /* =========================================
       4. 직접 입력 (Direct Input) 모달
       ========================================= */
    function openDirectInput(idx, key) {
      directEditTarget = { idx, key };
      const setItem = workoutData[currentExKey][idx];
      const field = document.getElementById('direct-input-field');
      const title = document.getElementById('direct-input-title');
      const presetBox = document.getElementById('direct-preset-container');

      if (key === 'weight') {
        title.innerText = `S${idx + 1} 세트 중량(kg) 직접 입력`;
        field.value = setItem.weight;
        presetBox.innerHTML = [0, 5, 10, 15, 20, 30, 40, 60].map(val =>
          `<button class="btn-preset" onclick="setQuickDirectVal(${val})">${val === 0 ? '맨몸(0)' : val + 'kg'}</button>`
        ).join('');
      } else {
        title.innerText = `S${idx + 1} 세트 반복 횟수(회) 직접 입력`;
        field.value = setItem.reps;
        presetBox.innerHTML = [5, 8, 10, 12, 15, 20, 25, 30].map(val =>
          `<button class="btn-preset" onclick="setQuickDirectVal(${val})">${val}회</button>`
        ).join('');
      }

      document.getElementById('direct-input-modal').style.display = 'flex';
      setTimeout(() => {
        field.focus();
        field.select();
      }, 60);
    }

    function setQuickDirectVal(val) {
      document.getElementById('direct-input-field').value = val;
      applyDirectInput();
    }

    function applyDirectInput() {
      const { idx, key } = directEditTarget;
      if (idx === null || !key) return;
      const rawVal = parseFloat(document.getElementById('direct-input-field').value);
      if (isNaN(rawVal)) {
        closeDirectInput();
        return;
      }

      const sets = workoutData[currentExKey];
      if (sets && sets[idx]) {
        if (key === 'weight') {
          sets[idx].weight = Math.max(0, parseFloat(rawVal.toFixed(1)));
        } else {
          sets[idx].reps = Math.max(1, Math.round(rawVal));
        }
        save();
        render();
      }
      closeDirectInput();
    }

    function closeDirectInput() {
      document.getElementById('direct-input-modal').style.display = 'none';
      directEditTarget = { idx: null, key: null };
    }

    /* =========================================
       5. 정밀 타이머 제어
       ========================================= */
    function syncTimerUI() {
      if (!timerTarget) return;
      const remaining = Math.ceil((timerTarget - Date.now()) / 1000);
      if (remaining <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerTarget = null;
        document.getElementById('timer-island').style.display = 'none';
        if ('vibrate' in navigator) navigator.vibrate([220, 100, 220, 100, 280]);
        playBeep();
      } else {
        const m = String(Math.floor(remaining / 60)).padStart(2, '0');
        const s = String(remaining % 60).padStart(2, '0');
        document.getElementById('timer-val').innerText = `${m}:${s}`;
        const progressPercent = Math.min(100, Math.max(0, ((timerTotalSec - remaining) / timerTotalSec) * 100));
        document.getElementById('timer-progress').style.width = `${progressPercent}%`;
      }
    }

    function startTimer(sec) {
      timerTotalSec = sec;
      timerTarget = Date.now() + sec * 1000;
      document.getElementById('timer-island').style.display = 'block';
      if (timerInterval) clearInterval(timerInterval);
      syncTimerUI();
      timerInterval = setInterval(syncTimerUI, 250);
    }

    function addTime(sec) {
      if (!timerTarget) return;
      timerTarget += sec * 1000;
      timerTotalSec = Math.max(10, timerTotalSec + sec);
      syncTimerUI();
    }

    function skipTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timerTarget = null;
      document.getElementById('timer-island').style.display = 'none';
    }

    /* =========================================
       6. 종목 관리 모달
       ========================================= */
    function openExModal(mode) {
      modalMode = mode;
      const modal = document.getElementById('ex-modal');
      const delBtn = document.getElementById('btn-delete-ex');

      if (mode === 'edit') {
        const ex = exercises[currentExKey];
        document.getElementById('ex-modal-title').innerText = '운동 설정 수정';
        document.getElementById('form-ex-name').value = ex.name;
        document.getElementById('form-ex-part').value = ex.part;
        document.getElementById('form-ex-target').value = ex.targetReps || 12;
        document.getElementById('form-ex-rest').value = String(ex.rest);
        document.getElementById('form-ex-step').value = String(ex.step);
        delBtn.style.display = 'block';
      } else {
        document.getElementById('ex-modal-title').innerText = '새 운동 추가';
        document.getElementById('form-ex-name').value = '';
        document.getElementById('form-ex-part').value = '가슴 & 전면삼각근';
        document.getElementById('form-ex-target').value = 15;
        document.getElementById('form-ex-rest').value = '60';
        document.getElementById('form-ex-step').value = '1';
        delBtn.style.display = 'none';
      }
      modal.style.display = 'flex';
    }

    function closeExModal() {
      document.getElementById('ex-modal').style.display = 'none';
    }

    function saveExerciseModal() {
      const name = document.getElementById('form-ex-name').value.trim();
      const part = document.getElementById('form-ex-part').value;
      const targetReps = Math.max(1, parseInt(document.getElementById('form-ex-target').value, 10) || 12);
      const rest = parseInt(document.getElementById('form-ex-rest').value, 10);
      const step = parseFloat(document.getElementById('form-ex-step').value);

      if (!name) {
        alert('운동 이름을 입력하세요.');
        return;
      }

      if (modalMode === 'edit') {
        exercises[currentExKey].name = name;
        exercises[currentExKey].part = part;
        exercises[currentExKey].targetReps = targetReps;
        exercises[currentExKey].rest = rest;
        exercises[currentExKey].step = step;
      } else {
        const newKey = 'ex_' + Date.now();
        exercises[newKey] = { name, part, rest, step, defaultWeight: 0.0, defaultReps: targetReps, targetReps };
        workoutData[newKey] = [
          { id: 1, weight: 0.0, reps: targetReps, done: false },
          { id: 2, weight: 0.0, reps: targetReps, done: false },
          { id: 3, weight: 0.0, reps: Math.max(1, targetReps - 2), done: false }
        ];
        currentExKey = newKey;
      }

      save();
      renderPicker();
      render();
      closeExModal();
    }

    function deleteCurrentExercise() {
      const keys = Object.keys(exercises);
      if (keys.length <= 1) {
        alert('최소 1개 종목은 있어야 합니다.');
        return;
      }
      if (!confirm(`'${exercises[currentExKey].name}' 종목을 삭제할까요?`)) return;

      delete exercises[currentExKey];
      delete workoutData[currentExKey];
      currentExKey = Object.keys(exercises)[0];
      save();
      renderPicker();
      render();
      closeExModal();
    }

    /* =========================================
       7. 백업 & 복원 (JSON)
       ========================================= */
    function openBackupModal() {
      const payload = {
        version: 'v10',
        exportedAt: new Date().toISOString(),
        exercises,
        workoutData
      };
      document.getElementById('backup-json-area').value = JSON.stringify(payload, null, 2);
      document.getElementById('backup-modal').style.display = 'flex';
    }

    function closeBackupModal() {
      document.getElementById('backup-modal').style.display = 'none';
    }

    function copyBackupText() {
      const text = document.getElementById('backup-json-area').value;
      navigator.clipboard.writeText(text).then(() => {
        alert('백업 JSON 코드가 클립보드에 복사되었습니다.');
      }).catch(() => {
        alert('텍스트 창을 길게 눌러 직접 복사해주세요.');
      });
    }

    function downloadBackupFile() {
      const text = document.getElementById('backup-json-area').value;
      const blob = new Blob([text], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `pro_iron_backup_${dateStr}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function applyRestoredPayload(parsed) {
      if (!parsed || !parsed.exercises || !parsed.workoutData) {
        throw new Error('유효하지 않은 백업 데이터 포맷입니다.');
      }
      exercises = parsed.exercises;
      workoutData = parsed.workoutData;
      currentExKey = Object.keys(exercises)[0];
      save();
      renderPicker();
      render();
      closeBackupModal();
      alert('데이터가 성공적으로 복원되었습니다.');
    }

    function restoreFromText() {
      try {
        const raw = document.getElementById('backup-json-area').value.trim();
        const parsed = JSON.parse(raw);
        applyRestoredPayload(parsed);
      } catch (e) {
        alert('복원 실패: ' + e.message);
      }
    }

    function uploadBackupFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          applyRestoredPayload(parsed);
        } catch (err) {
          alert('파일 복원 실패: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    /* =========================================
       8. 스포츠 과학 논문 기반 자체 연산 엔진
       ========================================= */
    function finishWorkout() {
      let totalVol = 0;
      let totalReps = 0;
      let totalCompletedSets = 0;

      // 부위별 세트 분류
      const partCounts = {
        '가슴(Push)': 0,
        '등·철봉(Pull)': 0,
        '어깨(Delt)': 0,
        '하체(Legs)': 0,
        '코어(Core)': 0
      };

      const targetPrescriptions = [];

      Object.keys(workoutData).forEach(k => {
        const ex = exercises[k];
        if (!ex) return;
        const doneSets = workoutData[k].filter(s => s.done);

        if (doneSets.length > 0) {
          totalCompletedSets += doneSets.length;
          let exReps = 0;
          let maxWeight = 0;

          doneSets.forEach(s => {
            const w = Number(s.weight) || 0;
            const r = Number(s.reps) || 0;
            totalVol += (w * r);
            totalReps += r;
            exReps += r;
            if (w > maxWeight) maxWeight = w;
          });

          // 부위 분류 카운팅
          if (ex.part.includes('가슴')) partCounts['가슴(Push)'] += doneSets.length;
          else if (ex.part.includes('광배근')) partCounts['등·철봉(Pull)'] += doneSets.length;
          else if (ex.part.includes('어깨') || ex.part.includes('삼각근')) partCounts['어깨(Delt)'] += doneSets.length;
          else if (ex.part.includes('하체')) partCounts['하체(Legs)'] += doneSets.length;
          else if (ex.part.includes('코어') || ex.part.includes('복직근')) partCounts['코어(Core)'] += doneSets.length;

          // Schoenfeld et al. (2021) 2중 진행법 & RIR 기반 과부하 판단
          const target = ex.targetReps || 12;
          const allHit = doneSets.every(s => s.reps >= target);

          if (maxWeight === 0) {
            // 맨몸 운동 처방
            if (allHit) {
              targetPrescriptions.push(`• ${ex.name} (총 ${exReps}회 수행):\n  🚀 [과부하 달성 / Schoenfeld 2021] 전 세트 ${target}회 완수 (RIR 0~1 도달). 다음 세션은 세트당 목표를 +2회 상향(총 ${target + 2}회)하거나 중량 조끼(+${ex.step}kg)를 도입하세요.`);
            } else {
              targetPrescriptions.push(`• ${ex.name} (총 ${exReps}회 수행):\n  ⚓ [자세 유지 / RIR 1~2 목표] 목표치 미달 세트 존재. 난이도 상향 없이 전 세트 ${target}회를 정자세로 채우는 유효 반복수(Effective Reps) 축적에 집중하세요.`);
            }
          } else {
            // 중량 웨이트 운동 처방
            if (allHit) {
              const nextWeight = (maxWeight + ex.step).toFixed(1);
              targetPrescriptions.push(`• ${ex.name} (최고 ${maxWeight}kg):\n  🚀 [중량 증량 처방] 목표 반복수 완수. 기계적 장력(Mechanical Tension) 향상을 위해 다음 세션은 ${nextWeight}kg으로 시작하여 ${doneSets.length}세트 진행하세요.`);
            } else {
              targetPrescriptions.push(`• ${ex.name} (최고 ${maxWeight}kg):\n  ⚓ [중량 동결] ${maxWeight}kg 유지. 실패 지점 직전의 유효 반복 확보를 위해 현재 중량에서 ${target}회 완수를 우선 달성하세요.`);
            }
          }
        }
      });

      if (totalCompletedSets === 0) {
        alert('완료(✓) 체크된 세트가 없습니다. 먼저 수행한 세트를 체크해 주세요.');
        return;
      }

      document.getElementById('res-reps').innerText = `${totalReps.toLocaleString()} 회`;
      document.getElementById('res-volume').innerText = `${totalVol.toLocaleString()} kg`;
      document.getElementById('res-sets').innerText = `${totalCompletedSets} SETS`;

      document.getElementById('presc-targets').innerText = targetPrescriptions.join('\n\n');

      // Baz-Valle (2022) 및 Helms (2015) 기반 논문 지표 분석
      const balanceNotes = [];
      balanceNotes.push(`📊 세션 부위별 세트 분포:\n   가슴(Push) ${partCounts['가슴(Push)']}S | 등(Pull) ${partCounts['등·철봉(Pull)']}S | 어깨 ${partCounts['어깨(Delt)']}S | 하체 ${partCounts['하체(Legs)']}S | 코어 ${partCounts['코어(Core)']}S\n`);

      // 1. 유효 볼륨 및 정크 볼륨 판정 (Baz-Valle et al., 2022)
      Object.entries(partCounts).forEach(([part, count]) => {
        if (count > 0 && count < 3) {
          balanceNotes.push(`⚠️ [${part} 최소 자극 미달]: 단일 세션 1~2세트는 근단백질 합성(MPS)을 자극하기에 볼륨이 부족합니다 (최소 3~4세트 권장).`);
        } else if (count >= 3 && count <= 6) {
          balanceNotes.push(`✅ [${part} 최적 유효 볼륨]: 1세션 최적 성장 구간(3~6S) 충족. 정크 볼륨 없이 효율적인 자극을 완료했습니다.`);
        } else if (count > 8) {
          balanceNotes.push(`🛑 [${part} 정크 볼륨(Junk Volume) 경고]: 8세트 초과 시 근비대 효율은 급감하고 근육 피로만 누적됩니다 (Baz-Valle 2022). 세트 수를 줄이고 강도를 높이세요.`);
        }
      });

      // 2. 상체 전후면 구조 균형비 (Push : Pull Ratio)
      const pushSets = partCounts['가슴(Push)'] + Math.floor(partCounts['어깨(Delt)'] * 0.5);
      const pullSets = partCounts['등·철봉(Pull)'] + Math.floor(partCounts['어깨(Delt)'] * 0.3);
      if (pushSets >= 4 && pullSets === 0) {
        balanceNotes.push(`\n🚨 [전후면 불균형 주의]: 미는 운동(Push) 대비 당기는 운동(Pull)이 전무합니다. 견관절 안정성과 라운드 숄더 방지를 위해 풀업 또는 페이스 풀을 반드시 배치하세요.`);
      }

      // 3. 근단백질 합성(MPS) 주기 기반 회복 시간 (Damas et al., 2016)
      if (totalCompletedSets <= 6) {
        balanceNotes.push(`\n💤 [권장 회복 텀]: 총 ${totalCompletedSets}세트(저~중볼륨) 수행. MPS 주기는 24~36시간 내에 회복되므로 1일 휴식 후 다른 부위 훈련이 가능합니다.`);
      } else {
        balanceNotes.push(`\n💤 [권장 회복 텀]: 총 ${totalCompletedSets}세트(고볼륨) 수행. 완전한 초과회복(Supercompensation)을 위해 최소 48시간(2일 뒤) 휴식을 권장합니다.`);
      }

      document.getElementById('presc-balance').innerText = balanceNotes.join('\n');
      document.getElementById('result-modal').style.display = 'flex';
    }

    function closeResultModal() {
      document.getElementById('result-modal').style.display = 'none';
    }

    function resetAllWorkout() {
      if (!confirm('완료 체크를 모두 풀고 새 세션을 시작할까요? (설정한 중량/횟수는 유지됩니다)')) return;
      Object.keys(workoutData).forEach(k => {
        workoutData[k].forEach(s => s.done = false);
      });
      save();
      render();
      closeResultModal();
    }

    function copyWorkoutPrompt() {
      const summary = [];
      Object.keys(workoutData).forEach(k => {
        const ex = exercises[k];
        if (!ex) return;
        const done = workoutData[k].filter(s => s.done);
        if (done.length > 0) {
          const setsStr = done.map((s, i) => `${i + 1}세트: ${Number(s.weight) === 0 ? '맨몸' : s.weight + 'kg'} x ${s.reps}회`).join(', ');
          summary.push(`- ${ex.name} (${ex.part} | 목표 ${ex.targetReps}회): ${setsStr}`);
        }
      });

      const promptText = `당신은 운동생리학 메타분석 연구(Schoenfeld, Phillips, Helms 등)에 기반한 전문 스트렝스/근비대 코치입니다.

[오늘 수행된 훈련 데이터]
${summary.join('\n')}

---
[요청 분석 과제]
1. 정크 볼륨(Junk Volume) 여부 및 유효 반복수(Effective Reps/RIR) 추정 평가
2. 전후면(Push vs Pull) 및 어깨 3면 밸런스 점검
3. 점진적 과부하(Progressive Overload) 원칙에 따른 다음 세션 각 종목별 구체적 목표 수치(시작 kg, 반복 횟수, 권장 세트 수)
4. 근단백질 합성(MPS) 주기 기반 권장 회복 시간`;

      navigator.clipboard.writeText(promptText).then(() => {
        alert('논문 분석용 프롬프트가 복사되었습니다!\nGemini 웹이나 앱 채팅창에 [붙여넣기]하세요.');
      }).catch(() => {
        prompt('아래 내용을 복사해 붙여넣으세요:', promptText);
      });
    }

    // 초기화
    loadStorageData();
    renderPicker();
    render();
  </script>
</body>
</html>
