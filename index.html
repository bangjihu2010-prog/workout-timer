<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PRO IRON - 맨몸 & 웨이트 운동 엔진</title>
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #141418;
      --card-border: #27272a;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --primary: #38bdf8;
      --text-main: #f4f4f5;
      --text-sub: #71717a;
      --danger: #f43f5e;
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      touch-action: manipulation; 
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 120px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      padding: 16px 20px;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-sub);
      text-transform: uppercase;
    }
    .btn-finish-workout {
      background: rgba(244, 63, 94, 0.15);
      color: var(--danger);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(244, 63, 94, 0.3);
      cursor: pointer;
    }
    .btn-finish-workout:active { transform: scale(0.95); }

    .exercise-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .select-wrapper {
      position: relative;
      flex: 1;
    }
    .exercise-select {
      width: 100%;
      background: #18181b;
      color: #fff;
      border: 1px solid #2e2e38;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      appearance: none;
      outline: none;
    }
    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: var(--text-sub);
      pointer-events: none;
    }
    .btn-manage {
      background: #18181b;
      color: var(--primary);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #2e2e38;
      white-space: nowrap;
      cursor: pointer;
    }

    .meta-chips {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .chip {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #18181b;
      color: #a1a1aa;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .chip-accent {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.2);
    }

    .content {
      padding: 16px 20px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .set-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .set-card.is-done {
      background: #0f0f13;
      border-color: rgba(255, 255, 255, 0.03);
      opacity: 0.45;
    }

    .set-tag {
      font-size: 14px;
      font-weight: 800;
      color: #52525b;
      min-width: 24px;
      text-align: center;
    }
    .set-card.is-done .set-tag {
      color: var(--accent);
    }

    .stepper-capsule {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d0d10;
      border: 1px solid #222228;
      border-radius: 10px;
      padding: 4px;
    }
    .stepper-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #1c1c22;
      color: #e4e4e7;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
    }
    .stepper-btn:active {
      background: var(--primary);
      color: #000;
    }
    .stepper-val {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 44px;
    }
    .val-num {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .val-unit {
      font-size: 9px;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: -1px;
    }

    .btn-complete {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #1c1c22;
      border: 1px solid #2e2e38;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-complete.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .btn-del {
      background: transparent;
      color: #3f3f46;
      font-size: 16px;
      padding: 6px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-del:active {
      color: var(--danger);
    }

    .btn-add-set {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.05);
      border: 1px dashed rgba(56, 189, 248, 0.25);
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      cursor: pointer;
    }

    #timer-island {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 20px;
      right: 20px;
      background: rgba(24, 24, 27, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.15);
      border-radius: 18px;
      padding: 14px 18px;
      z-index: 100;
      overflow: hidden;
    }
    .timer-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: rgba(16, 185, 129, 0.08);
      z-index: 0;
      transition: width 0.3s linear;
    }
    .timer-content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-meta {
      display: flex;
      flex-direction: column;
    }
    .timer-tag {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .timer-clock {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      margin-top: 2px;
    }
    .timer-btn-group {
      display: flex;
      gap: 8px;
    }
    .timer-action {
      background: #27272a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .timer-action-skip {
      background: #3f3f46;
      color: #d4d4d8;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
      align-items: flex-end;
      padding: 0;
    }
    .modal-sheet {
      width: 100%;
      background: #141418;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid #27272a;
      border-bottom: none;
      padding: 24px 20px 36px 20px;
      box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.5);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-grabber {
      width: 40px;
      height: 4px;
      background: #3f3f46;
      border-radius: 2px;
      margin: 0 auto 18px auto;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }
    .input-field, .select-field {
      width: 100%;
      background: #0d0d10;
      border: 1px solid #27272a;
      padding: 12px 14px;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      margin-bottom: 14px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-tile {
      background: #0d0d10;
      border: 1px solid #222228;
      padding: 14px;
      border-radius: 14px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
    }
    .stat-number {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-top: 4px;
    }

    .prescription-card {
      background: #0d0d10;
      border: 1px solid #222228;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--accent);
    }
    .prescription-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .prescription-body {
      font-size: 13px;
      line-height: 1.6;
      color: #d4d4d8;
      white-space: pre-line;
    }

    .action-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .btn-copy-prompt {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-copy-prompt:active { background: #38bdf8; color: #000; }
    
    .btn-sheet-close {
      width: 100%;
      padding: 12px;
      background: #1e1e24;
      border-radius: 12px;
      color: #a1a1aa;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      border: none;
      cursor: pointer;
    }
    .btn-sheet-reset {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <span class="brand-title">Pro Workout Engine</span>
      <button class="btn-finish-workout" onclick="finishWorkout()">운동 종료 & 처방</button>
    </div>

    <div class="exercise-bar">
      <div class="select-wrapper">
        <select id="exercise-picker" class="exercise-select" onchange="changeExercise(this.value)"></select>
        <span class="select-arrow">▼</span>
      </div>
      <button class="btn-manage" onclick="openExModal('edit')">수정</button>
      <button class="btn-manage" onclick="openExModal('add')">+종목</button>
    </div>

    <div class="meta-chips">
      <span id="chip-part" class="chip chip-accent"></span>
      <span id="chip-rest" class="chip"></span>
      <span id="chip-step" class="chip"></span>
    </div>
  </header>

  <main class="content">
    <div class="section-header">
      <span class="section-title">SET LOGS</span>
      <span class="section-title" id="completed-count">0 / 0 완료</span>
    </div>

    <div id="set-list"></div>

    <button class="btn-add-set" onclick="addSet()">
      <span>+</span> 세트 추가
    </button>
  </main>

  <aside id="timer-island">
    <div id="timer-progress" class="timer-progress"></div>
    <div class="timer-content">
      <div class="timer-meta">
        <span class="timer-tag">REST INTERVAL</span>
        <span id="timer-val" class="timer-clock">01:00</span>
      </div>
      <div class="timer-btn-group">
        <button class="timer-action" onclick="addTime(30)">+30s</button>
        <button class="timer-action timer-action-skip" onclick="skipTimer()">스킵</button>
      </div>
    </div>
  </aside>

  <!-- 종목 설정 모달 -->
  <div id="ex-modal" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-grabber"></div>
      <h2 id="ex-modal-title" class="modal-title">운동 종목 설정</h2>
      
      <label class="form-label">운동 이름</label>
      <input type="text" id="form-ex-name" class="input-field" placeholder="예: 푸쉬업">

      <label class="form-label">타깃 부위</label>
      <select id="form-ex-part" class="select-field">
        <option value="가슴 & 전면삼각근">가슴 & 전면삼각근 (푸쉬업류)</option>
        <option value="가슴 & 삼두근">가슴 & 삼두근 (다이아몬드/딥스)</option>
        <option value="광배근 & 상체 프레임">광배근 & 상체 프레임 (풀업/친업)</option>
        <option value="어깨 삼각근">어깨 삼각근 (파이크 푸쉬업/사레레/OHP)</option>
        <option value="하체 대퇴 & 둔근">하체 대퇴 & 둔근 (스쿼트)</option>
        <option value="복직근 & 코어">복직근 & 코어 (크런치/레그레이즈)</option>
        <option value="기타 전신">기타 전신</option>
      </select>

      <label class="form-label">세트 간 휴식 시간</label>
      <select id="form-ex-rest" class="select-field">
        <option value="30">30초 (짧은 맨몸 인터벌)</option>
        <option value="45">45초 (기본 맨몸/코어)</option>
        <option value="60">60초 (기본 고립/푸쉬업)</option>
        <option value="90">90초 (철봉/복합 운동)</option>
        <option value="120">120초 (고중량 웨이트)</option>
      </select>

      <label class="form-label">중량 조절 단위 (+/-)</label>
      <select id="form-ex-step" class="select-field">
        <option value="0.5">0.5 kg (미세 조절)</option>
        <option value="1">1.0 kg (중량 조끼/덤벨)</option>
        <option value="2">2.0 kg</option>
        <option value="2.5">2.5 kg (원판 단위)</option>
        <option value="5">5.0 kg</option>
      </select>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <button style="flex:1; padding:14px; background:var(--primary); color:#000; border-radius:12px; font-weight:700; border:none; cursor:pointer;" onclick="saveExerciseModal()">저장 완료</button>
        <button id="btn-delete-ex" style="padding:14px; background:rgba(244,63,94,0.15); color:var(--danger); border-radius:12px; font-weight:700; border:none; cursor:pointer;" onclick="deleteCurrentExercise()">삭제</button>
      </div>
      <button class="btn-sheet-close" onclick="closeExModal()">취소</button>
    </div>
  </div>

  <!-- 결과 및 즉시 처방 모달 -->
  <div id="result-modal" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-grabber"></div>
      <h2 class="modal-title">세션 분석 & 다음 루틴 처방</h2>

      <div class="stat-grid">
        <div class="stat-tile">
          <span class="stat-label">TOTAL VOLUME</span>
          <div id="res-volume" class="stat-number">0 kg</div>
        </div>
        <div class="stat-tile">
          <span class="stat-label">COMPLETED SETS</span>
          <div id="res-sets" class="stat-number">0 SETS</div>
        </div>
      </div>

      <div class="prescription-card">
        <div class="prescription-title">🎯 다음 운동 세션 목표 처방</div>
        <div id="presc-targets" class="prescription-body"></div>
      </div>

      <div class="prescription-card" style="border-left-color: var(--primary);">
        <div class="prescription-title" style="color: var(--primary);">⚖️ 상체 밸런스 & 휴식 가이드</div>
        <div id="presc-balance" class="prescription-body"></div>
      </div>

      <div class="action-btn-row">
        <button class="btn-copy-prompt" onclick="copyWorkoutPrompt()">📋 Gemini 웹용 질문 복사</button>
      </div>

      <button class="btn-sheet-close" onclick="closeResultModal()">닫기</button>
      <button class="btn-sheet-reset" onclick="resetAllWorkout()">세션 완료 체크 풀기 (새 운동 시작)</button>
    </div>
  </div>

  <script>
    const DEFAULT_EXERCISES = {
      // 간단한 맨몸 운동 라인업
      pushup: { name: '푸쉬업 (팔굽혀펴기)', part: '가슴 & 전면삼각근', rest: 60, step: 0.5, defaultWeight: 0.0, defaultReps: 15, targetReps: 20 },
      knee_pushup: { name: '니 푸쉬업 (무릎 대고)', part: '가슴 기초 & 워밍업', rest: 45, step: 0.5, defaultWeight: 0.0, defaultReps: 15, targetReps: 20 },
      diamond_pushup: { name: '다이아몬드 푸쉬업', part: '가슴 & 삼두근', rest: 60, step: 0.5, defaultWeight: 0.0, defaultReps: 10, targetReps: 12 },
      decline_pushup: { name: '디클라인 푸쉬업', part: '어깨 삼각근 & 윗가슴', rest: 60, step: 0.5, defaultWeight: 0.0, defaultReps: 12, targetReps: 15 },
      squat: { name: '맨몸 스쿼트', part: '하체 대퇴 & 둔근', rest: 60, step: 0.5, defaultWeight: 0.0, defaultReps: 20, targetReps: 25 },
      crunch: { name: '크런치 (복근)', part: '복직근 & 코어', rest: 45, step: 0.5, defaultWeight: 0.0, defaultReps: 20, targetReps: 25 },

      // 철봉 운동
      pullup: { name: '풀업 (턱걸이)', part: '광배근 & 상체 프레임', rest: 90, step: 1.0, defaultWeight: 0.0, defaultReps: 8, targetReps: 10 },
      chinup: { name: '친업 (언더그립)', part: '광배근 & 상체 프레임', rest: 90, step: 1.0, defaultWeight: 0.0, defaultReps: 8, targetReps: 10 },
      dips: { name: '딥스 (평행봉)', part: '가슴 & 삼두근', rest: 90, step: 1.0, defaultWeight: 0.0, defaultReps: 10, targetReps: 12 },
      hanging_legraise: { name: '행잉 레그레이즈', part: '복직근 & 코어', rest: 60, step: 0.5, defaultWeight: 0.0, defaultReps: 12, targetReps: 15 },

      // 웨이트 운동
      ohp: { name: '오버헤드 프레스', part: '어깨 삼각근', rest: 120, step: 2.5, defaultWeight: 35.0, defaultReps: 6, targetReps: 8 },
      lateral: { name: '사이드 레터럴 레이즈', part: '어깨 삼각근', rest: 60, step: 0.5, defaultWeight: 12.0, defaultReps: 15, targetReps: 15 },
      facepull: { name: '페이스 풀', part: '어깨 삼각근', rest: 60, step: 1.0, defaultWeight: 20.0, defaultReps: 12, targetReps: 15 }
    };

    const DEFAULT_SETS = {
      pushup: [
        { id: 1, weight: 0.0, reps: 15, done: false },
        { id: 2, weight: 0.0, reps: 15, done: false },
        { id: 3, weight: 0.0, reps: 12, done: false }
      ],
      knee_pushup: [
        { id: 1, weight: 0.0, reps: 15, done: false },
        { id: 2, weight: 0.0, reps: 15, done: false },
        { id: 3, weight: 0.0, reps: 15, done: false }
      ],
      diamond_pushup: [
        { id: 1, weight: 0.0, reps: 10, done: false },
        { id: 2, weight: 0.0, reps: 10, done: false },
        { id: 3, weight: 0.0, reps: 8, done: false }
      ],
      decline_pushup: [
        { id: 1, weight: 0.0, reps: 12, done: false },
        { id: 2, weight: 0.0, reps: 12, done: false },
        { id: 3, weight: 0.0, reps: 10, done: false }
      ],
      squat: [
        { id: 1, weight: 0.0, reps: 20, done: false },
        { id: 2, weight: 0.0, reps: 20, done: false },
        { id: 3, weight: 0.0, reps: 20, done: false }
      ],
      crunch: [
        { id: 1, weight: 0.0, reps: 20, done: false },
        { id: 2, weight: 0.0, reps: 20, done: false },
        { id: 3, weight: 0.0, reps: 15, done: false }
      ],
      pullup: [
        { id: 1, weight: 0.0, reps: 8, done: false },
        { id: 2, weight: 0.0, reps: 7, done: false },
        { id: 3, weight: 0.0, reps: 6, done: false }
      ],
      chinup: [
        { id: 1, weight: 0.0, reps: 8, done: false },
        { id: 2, weight: 0.0, reps: 7, done: false },
        { id: 3, weight: 0.0, reps: 6, done: false }
      ],
      dips: [
        { id: 1, weight: 0.0, reps: 10, done: false },
        { id: 2, weight: 0.0, reps: 10, done: false },
        { id: 3, weight: 0.0, reps: 8, done: false }
      ],
      hanging_legraise: [
        { id: 1, weight: 0.0, reps: 12, done: false },
        { id: 2, weight: 0.0, reps: 12, done: false },
        { id: 3, weight: 0.0, reps: 10, done: false }
      ],
      ohp: [
        { id: 1, weight: 35.0, reps: 6, done: false },
        { id: 2, weight: 35.0, reps: 6, done: false },
        { id: 3, weight: 35.0, reps: 5, done: false }
      ],
      lateral: [
        { id: 1, weight: 12.0, reps: 15, done: false },
        { id: 2, weight: 12.0, reps: 14, done: false },
        { id: 3, weight: 12.0, reps: 12, done: false }
      ],
      facepull: [
        { id: 1, weight: 20.0, reps: 15, done: false },
        { id: 2, weight: 20.0, reps: 15, done: false },
        { id: 3, weight: 20.0, reps: 12, done: false }
      ]
    };

    let exercises = {};
    let workoutData = {};
    let currentExKey = 'pushup';
    let modalMode = 'add';
    let timerTarget = null;
    let timerTotalSec = 60;
    let timerInterval = null;

    try {
      const savedEx = localStorage.getItem('custom_exercises_v9');
      const savedSets = localStorage.getItem('workout_sets_v9');
      exercises = savedEx ? JSON.parse(savedEx) : JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
      workoutData = savedSets ? JSON.parse(savedSets) : JSON.parse(JSON.stringify(DEFAULT_SETS));
      if (!exercises || Object.keys(exercises).length === 0) exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
    } catch (e) {
      exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
      workoutData = JSON.parse(JSON.stringify(DEFAULT_SETS));
    }

    currentExKey = Object.keys(exercises)[0];

    function save() {
      try {
        localStorage.setItem('custom_exercises_v9', JSON.stringify(exercises));
        localStorage.setItem('workout_sets_v9', JSON.stringify(workoutData));
      } catch (e) {}
    }

    function renderPicker() {
      const picker = document.getElementById('exercise-picker');
      picker.innerHTML = Object.keys(exercises).map(k => 
        `<option value="${k}" ${k === currentExKey ? 'selected' : ''}>${exercises[k].name}</option>`
      ).join('');
      const ex = exercises[currentExKey];
      document.getElementById('chip-part').innerText = ex.part;
      document.getElementById('chip-rest').innerText = `휴식 ${ex.rest}s`;
      document.getElementById('chip-step').innerText = `단위 ${ex.step}kg`;
    }

    function changeExercise(key) {
      currentExKey = key;
      renderPicker();
      render();
    }

    function openExModal(mode) {
      modalMode = mode;
      const modal = document.getElementById('ex-modal');
      const delBtn = document.getElementById('btn-delete-ex');

      if (mode === 'edit') {
        const ex = exercises[currentExKey];
        document.getElementById('ex-modal-title').innerText = '운동 설정 수정';
        document.getElementById('form-ex-name').value = ex.name;
        document.getElementById('form-ex-part').value = ex.part;
        document.getElementById('form-ex-rest').value = String(ex.rest);
        document.getElementById('form-ex-step').value = String(ex.step);
        delBtn.style.display = 'block';
      } else {
        document.getElementById('ex-modal-title').innerText = '새 운동 추가';
        document.getElementById('form-ex-name').value = '';
        document.getElementById('form-ex-part').value = '가슴 & 전면삼각근';
        document.getElementById('form-ex-rest').value = '60';
        document.getElementById('form-ex-step').value = '1';
        delBtn.style.display = 'none';
      }
      modal.style.display = 'flex';
    }

    function closeExModal() {
      document.getElementById('ex-modal').style.display = 'none';
    }

    function saveExerciseModal() {
      const name = document.getElementById('form-ex-name').value.trim();
      const part = document.getElementById('form-ex-part').value;
      const rest = parseInt(document.getElementById('form-ex-rest').value, 10);
      const step = parseFloat(document.getElementById('form-ex-step').value);

      if (!name) {
        alert('운동 이름을 입력하세요.');
        return;
      }

      if (modalMode === 'edit') {
        exercises[currentExKey].name = name;
        exercises[currentExKey].part = part;
        exercises[currentExKey].rest = rest;
        exercises[currentExKey].step = step;
      } else {
        const newKey = 'ex_' + Date.now();
        exercises[newKey] = { name, part, rest, step, defaultWeight: 0.0, defaultReps: 15, targetReps: 20 };
        workoutData[newKey] = [
          { id: 1, weight: 0.0, reps: 15, done: false },
          { id: 2, weight: 0.0, reps: 15, done: false },
          { id: 3, weight: 0.0, reps: 12, done: false }
        ];
        currentExKey = newKey;
      }

      save();
      renderPicker();
      render();
      closeExModal();
    }

    function deleteCurrentExercise() {
      const keys = Object.keys(exercises);
      if (keys.length <= 1) {
        alert('최소 1개 종목은 있어야 합니다.');
        return;
      }
      if (!confirm(`'${exercises[currentExKey].name}' 종목을 삭제할까요?`)) return;

      delete exercises[currentExKey];
      delete workoutData[currentExKey];
      currentExKey = Object.keys(exercises)[0];
      save();
      renderPicker();
      render();
      closeExModal();
    }

    function render() {
      if (!workoutData[currentExKey]) workoutData[currentExKey] = [];
      const sets = workoutData[currentExKey];
      const ex = exercises[currentExKey];
      const container = document.getElementById('set-list');

      const completed = sets.filter(s => s.done).length;
      document.getElementById('completed-count').innerText = `${completed} / ${sets.length} 완료`;

      container.innerHTML = sets.map((s, idx) => `
        <div class="set-card ${s.done ? 'is-done' : ''}">
          <div class="set-tag">S${idx + 1}</div>

          <div class="stepper-capsule">
            <button class="stepper-btn" onclick="updateVal(${idx}, 'weight', -${ex.step})">-</button>
            <div class="stepper-val">
              <span class="val-num">${Number(s.weight) === 0 ? '맨몸' : Number(s.weight).toFixed(1)}</span>
              <span class="val-unit">${Number(s.weight) === 0 ? 'BODY' : 'KG'}</span>
            </div>
            <button class="stepper-btn" onclick="updateVal(${idx}, 'weight', ${ex.step})">+</button>
          </div>

          <div class="stepper-capsule">
            <button class="stepper-btn" onclick="updateVal(${idx}, 'reps', -1)">-</button>
            <div class="stepper-val">
              <span class="val-num">${s.reps}</span>
              <span class="val-unit">REPS</span>
            </div>
            <button class="stepper-btn" onclick="updateVal(${idx}, 'reps', 1)">+</button>
          </div>

          <button class="btn-complete ${s.done ? 'done' : ''}" onclick="toggleSet(${idx})">✓</button>
          <button class="btn-del" onclick="deleteSet(${idx})">✕</button>
        </div>
      `).join('');
    }

    function updateVal(idx, key, delta) {
      const sets = workoutData[currentExKey];
      if (!sets || !sets[idx] || sets[idx].done) return;
      if (key === 'weight') sets[idx].weight = Math.max(0, parseFloat((Number(sets[idx].weight) + delta).toFixed(1)));
      if (key === 'reps') sets[idx].reps = Math.max(1, sets[idx].reps + delta);
      save();
      render();
    }

    function addSet() {
      if (!workoutData[currentExKey]) workoutData[currentExKey] = [];
      const sets = workoutData[currentExKey];
      const ex = exercises[currentExKey];
      const last = sets.length > 0 ? sets[sets.length - 1] : null;

      sets.push({
        id: Date.now(),
        weight: last ? Number(last.weight) : (ex.defaultWeight || 0.0),
        reps: last ? Number(last.reps) : (ex.defaultReps || 15),
        done: false
      });
      save();
      render();
    }

    function deleteSet(idx) {
      const sets = workoutData[currentExKey];
      if (!sets || sets.length <= 1) {
        alert('최소 1개 세트는 유지되어야 합니다.');
        return;
      }
      sets.splice(idx, 1);
      save();
      render();
    }

    function toggleSet(idx) {
      const sets = workoutData[currentExKey];
      if (!sets || !sets[idx]) return;
      sets[idx].done = !sets[idx].done;
      save();
      render();
      if (sets[idx].done) {
        if ('vibrate' in navigator) navigator.vibrate(50);
        startTimer(exercises[currentExKey].rest);
      }
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    function startTimer(sec) {
      timerTotalSec = sec;
      timerTarget = Date.now() + sec * 1000;
      document.getElementById('timer-island').style.display = 'block';
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        const remaining = Math.ceil((timerTarget - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer-island').style.display = 'none';
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200, 100, 200]);
          playBeep();
        } else {
          const m = String(Math.floor(remaining / 60)).padStart(2, '0');
          const s = String(remaining % 60).padStart(2, '0');
          document.getElementById('timer-val').innerText = `${m}:${s}`;
          
          const progressPercent = ((timerTotalSec - remaining) / timerTotalSec) * 100;
          document.getElementById('timer-progress').style.width = `${progressPercent}%`;
        }
      }, 250);
    }

    function addTime(sec) {
      if (!timerTarget) return;
      timerTarget += sec * 1000;
      timerTotalSec += sec;
    }

    function skipTimer() {
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('timer-island').style.display = 'none';
      timerTarget = null;
    }

    // 자체 연산 엔진 (맨몸 및 웨이트 통합 점진적 과부하 처방)
    function finishWorkout() {
      let totalVol = 0;
      let totalCompletedSets = 0;
      const partCounts = { '가슴·푸쉬업': 0, '등·철봉': 0, '어깨': 0, '하체': 0, '코어': 0 };
      const targetPrescriptions = [];

      Object.keys(workoutData).forEach(k => {
        const ex = exercises[k];
        if (!ex) return;
        const doneSets = workoutData[k].filter(s => s.done);

        if (doneSets.length > 0) {
          totalCompletedSets += doneSets.length;
          doneSets.forEach(s => totalVol += (s.weight * s.reps));

          // 부위별 집계
          if (ex.part.includes('가슴')) partCounts['가슴·푸쉬업'] += doneSets.length;
          else if (ex.part.includes('광배근')) partCounts['등·철봉'] += doneSets.length;
          else if (ex.part.includes('어깨')) partCounts['어깨'] += doneSets.length;
          else if (ex.part.includes('하체')) partCounts['하체'] += doneSets.length;
          else if (ex.part.includes('코어') || ex.part.includes('복직근')) partCounts['코어'] += doneSets.length;

          // 2중 진행법 적용
          const topSet = doneSets[0];
          const allHit = doneSets.every(s => s.reps >= (ex.targetReps || 15));

          if (topSet.weight === 0) {
            if (allHit) {
              targetPrescriptions.push(`• ${ex.name}: 🚀 [목표 돌파] 전 세트 ${ex.targetReps}회 완수! 다음엔 중량 조끼 착용(+${ex.step}kg) 또는 더 어려운 변형 동작(다이아몬드/디클라인)으로 난이도를 올리세요.`);
            } else {
              targetPrescriptions.push(`• ${ex.name}: ⚓ [반복수 집중] 전 세트 목표치(${ex.targetReps}회)를 흐트러짐 없이 채울 수 있을 때까지 맨몸 반복수 누적에 집중.`);
            }
          } else {
            if (allHit) {
              const nextWeight = (topSet.weight + ex.step).toFixed(1);
              targetPrescriptions.push(`• ${ex.name}: 🚀 [중량 증량] 전 세트 목표치 달성! 다음엔 ${nextWeight}kg으로 ${doneSets.length}세트 진행.`);
            } else {
              targetPrescriptions.push(`• ${ex.name}: ⚓ [중량 유지] 현재 ${topSet.weight}kg 유지. 모든 세트를 최소 ${ex.targetReps || 10}회 채우는 데 집중.`);
            }
          }
        }
      });

      if (totalCompletedSets === 0) {
        alert('완료(✓) 체크된 세트가 없습니다. 먼저 수행한 세트를 체크해 주세요.');
        return;
      }

      document.getElementById('res-volume').innerText = `${totalVol.toLocaleString()} kg (추가중량)`;
      document.getElementById('res-sets').innerText = `${totalCompletedSets} SETS`;

      document.getElementById('presc-targets').innerText = targetPrescriptions.join('\n\n');

      let balanceText = `수행 세트: 가슴·푸쉬업 ${partCounts['가슴·푸쉬업']}S | 등·철봉 ${partCounts['등·철봉']}S | 어깨 ${partCounts['어깨']}S | 하체 ${partCounts['하체']}S | 코어 ${partCounts['코어']}S\n`;
      if (partCounts['가슴·푸쉬업'] >= 4 && partCounts['등·철봉'] === 0) {
        balanceText += `💡 [균형 권장] 미는 푸쉬업 동작이 많습니다. 라운드 숄더 방지를 위해 당기는 풀업이나 밴드 로우를 짝지어 진행하세요.\n`;
      }
      balanceText += `💤 [휴식 시간] 가슴과 전면 어깨 근육 회복을 위해 최소 24~48시간 휴식을 권장합니다.`;

      document.getElementById('presc-balance').innerText = balanceText;
      document.getElementById('result-modal').style.display = 'flex';
    }

    function closeResultModal() {
      document.getElementById('result-modal').style.display = 'none';
    }

    function resetAllWorkout() {
      if (!confirm('완료 체크를 모두 풀고 새 세션을 시작할까요? (설정한 중량/횟수는 유지됩니다)')) return;
      Object.keys(workoutData).forEach(k => {
        workoutData[k].forEach(s => s.done = false);
      });
      save();
      render();
      closeResultModal();
    }

    function copyWorkoutPrompt() {
      const summary = [];
      Object.keys(workoutData).forEach(k => {
        const ex = exercises[k];
        if (!ex) return;
        const done = workoutData[k].filter(s => s.done);
        if (done.length > 0) {
          const setsStr = done.map((s, i) => `${i+1}세트: ${s.weight === 0 ? '맨몸' : s.weight + 'kg'} x ${s.reps}회`).join(', ');
          summary.push(`- ${ex.name} (${ex.part}): ${setsStr}`);
        }
      });

      const promptText = `맨몸운동 및 상체 웨이트 운동 피드백 부탁해.\n\n[오늘 수행한 운동 기록]\n${summary.join('\n')}\n\n1. 점진적 과부하와 부위별 볼륨 밸런스 평가\n2. 다음 운동 세션 각 종목별 구체적인 목표 횟수 및 난이도 처방\n3. 권장 회복 시간`;

      navigator.clipboard.writeText(promptText).then(() => {
        alert('운동 기록이 복사되었습니다!\nGemini 웹이나 앱 채팅창에 그대로 [붙여넣기]하세요.');
      }).catch(() => {
        prompt('아래 내용을 복사해 Gemini에 붙여넣으세요:', promptText);
      });
    }

    renderPicker();
    render();
  </script>
</body>
