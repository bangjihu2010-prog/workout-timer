<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 뷰포트 확대 축소 원천 차단 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PRO IRON - 어깨 볼륨 & 타이머</title>
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #141418;
      --card-border: #27272a;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --primary: #38bdf8;
      --text-main: #f4f4f5;
      --text-sub: #71717a;
      --danger: #f43f5e;
    }
    
    /* 더블탭 줌 및 불필요한 확대 동작 방지 */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; 
      touch-action: manipulation; /* 더블클릭 줌 딜레이 및 확대 차단 */
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 120px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* 상단 헤더 */
    header {
      padding: 16px 20px;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-sub);
      text-transform: uppercase;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    button { cursor: pointer; border: none; font-family: inherit; outline: none; transition: transform 0.1s ease; }
    button:active { transform: scale(0.96); }

    .btn-icon {
      background: #1e1e24;
      color: #d4d4d8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #2e2e38;
    }
    .btn-finish-workout {
      background: rgba(244, 63, 94, 0.15);
      color: var(--danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    /* 종목 선택 영역 */
    .exercise-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .select-wrapper {
      position: relative;
      flex: 1;
    }
    .exercise-select {
      width: 100%;
      background: #18181b;
      color: #fff;
      border: 1px solid #2e2e38;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      appearance: none;
      outline: none;
    }
    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: var(--text-sub);
      pointer-events: none;
    }
    .btn-manage {
      background: #18181b;
      color: var(--primary);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #2e2e38;
      white-space: nowrap;
    }

    /* 메타 정보 칩 */
    .meta-chips {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .chip {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #18181b;
      color: #a1a1aa;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .chip-accent {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.2);
    }

    /* 메인 리스트 컨테이너 */
    .content {
      padding: 16px 20px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    /* 세트 카드 */
    .set-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
    }
    .set-card.is-done {
      background: #0f0f13;
      border-color: rgba(255, 255, 255, 0.03);
      opacity: 0.45;
    }

    .set-tag {
      font-size: 14px;
      font-weight: 800;
      color: #52525b;
      min-width: 24px;
      text-align: center;
    }
    .set-card.is-done .set-tag {
      color: var(--accent);
    }

    /* 캡슐형 스테퍼 */
    .stepper-capsule {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d0d10;
      border: 1px solid #222228;
      border-radius: 10px;
      padding: 4px;
    }
    .stepper-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #1c1c22;
      color: #e4e4e7;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stepper-btn:active {
      background: var(--primary);
      color: #000;
    }
    .stepper-val {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 44px;
    }
    .val-num {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .val-unit {
      font-size: 9px;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: -1px;
    }

    /* 체크 및 액션 버튼 */
    .btn-complete {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #1c1c22;
      border: 1px solid #2e2e38;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-complete.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      box-shadow: 0 0 16px var(--accent-glow);
      transform: scale(1.04);
    }
    .btn-del {
      background: transparent;
      color: #3f3f46;
      font-size: 16px;
      padding: 6px;
      border-radius: 6px;
    }
    .btn-del:active {
      color: var(--danger);
    }

    /* 세트 추가 버튼 */
    .btn-add-set {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.05);
      border: 1px dashed rgba(56, 189, 248, 0.25);
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    /* 플로팅 아일랜드 타이머 */
    #timer-island {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 20px;
      right: 20px;
      background: rgba(24, 24, 27, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.15);
      border-radius: 18px;
      padding: 14px 18px;
      z-index: 100;
      overflow: hidden;
    }
    .timer-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: rgba(16, 185, 129, 0.08);
      z-index: 0;
      transition: width 0.3s linear;
    }
    .timer-content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-meta {
      display: flex;
      flex-direction: column;
    }
    .timer-tag {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .timer-clock {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      margin-top: 2px;
    }
    .timer-btn-group {
      display: flex;
      gap: 8px;
    }
    .timer-action {
      background: #27272a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .timer-action-skip {
      background: #3f3f46;
      color: #d4d4d8;
    }

    /* 모달 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
      align-items: flex-end;
      padding: 0;
    }
    .modal-sheet {
      width: 100%;
      background: #141418;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid #27272a;
      border-bottom: none;
      padding: 24px 20px 36px 20px;
      box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.5);
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-grabber {
      width: 40px;
      height: 4px;
      background: #3f3f46;
      border-radius: 2px;
      margin: 0 auto 18px auto;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }
    .input-field, .select-field {
      width: 100%;
      background: #0d0d10;
      border: 1px solid #27272a;
      padding: 12px 14px;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      margin-bottom: 14px;
    }
    .input-field:focus, .select-field:focus {
      border-color: var(--primary);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-tile {
      background: #0d0d10;
      border: 1px solid #222228;
      padding: 14px;
      border-radius: 14px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
    }
    .stat-number {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-top: 4px;
    }

    .btn-ai-cta {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .ai-feedback-view {
      margin-top: 14px;
      background: #0d0d10;
      border-radius: 14px;
      padding: 16px;
      border-left: 3px solid var(--primary);
      font-size: 13px;
      line-height: 1.6;
      color: #d4d4d8;
      white-space: pre-line;
      min-height: 90px;
    }
    .btn-sheet-close {
      width: 100%;
      padding: 12px;
      background: #1e1e24;
      border-radius: 12px;
      color: #a1a1aa;
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
    }
    .btn-sheet-reset {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="header-top">
      <span class="brand-title">Pro Workout Engine</span>
      <div class="header-actions">
        <button class="btn-icon" onclick="configureApiKey()">API 키</button>
        <button class="btn-finish-workout" onclick="finishWorkout()">운동 종료</button>
      </div>
    </div>

    <div class="exercise-bar">
      <div class="select-wrapper">
        <select id="exercise-picker" class="exercise-select" onchange="changeExercise(this.value)"></select>
        <span class="select-arrow">▼</span>
      </div>
      <button class="btn-manage" onclick="openExModal('edit')">수정</button>
      <button class="btn-manage" onclick="openExModal('add')">+종목</button>
    </div>

    <div class="meta-chips">
      <span id="chip-part" class="chip chip-accent"></span>
      <span id="chip-rest" class="chip"></span>
      <span id="chip-step" class="chip"></span>
    </div>
  </header>

  <!-- 메인 세트 영역 -->
  <main class="content">
    <div class="section-header">
      <span class="section-title">SET LOGS</span>
      <span class="section-title" id="completed-count">0 / 0 완료</span>
    </div>

    <div id="set-list"></div>

    <button class="btn-add-set" onclick="addSet()">
      <span>+</span> 세트 추가
    </button>
  </main>

  <!-- 플로팅 아일랜드 타이머 -->
  <aside id="timer-island">
    <div id="timer-progress" class="timer-progress"></div>
    <div class="timer-content">
      <div class="timer-meta">
        <span class="timer-tag">REST INTERVAL</span>
        <span id="timer-val" class="timer-clock">01:00</span>
      </div>
      <div class="timer-btn-group">
        <button class="timer-action" onclick="addTime(30)">+30s</button>
        <button class="timer-action timer-action-skip" onclick="skipTimer()">스킵</button>
      </div>
    </div>
  </aside>

  <!-- 종목 관리 모달 -->
  <div id="ex-modal" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-grabber"></div>
      <h2 id="ex-modal-title" class="modal-title">운동 종목 설정</h2>
      
      <label class="form-label">운동 이름</label>
      <input type="text" id="form-ex-name" class="input-field" placeholder="예: 덤벨 숄더 프레스">

      <label class="form-label">타깃 부위 (AI 밸런스 분석용)</label>
      <select id="form-ex-part" class="select-field">
        <option value="전면삼각근">전면삼각근</option>
        <option value="측면삼각근">측면삼각근</option>
        <option value="후면삼각근">후면삼각근</option>
        <option value="전면·측면 복합">전면·측면 복합 (프레스류)</option>
        <option value="기타 상체">기타 상체</option>
      </select>

      <label class="form-label">세트 간 휴식 시간</label>
      <select id="form-ex-rest" class="select-field">
        <option value="45">45초</option>
        <option value="60">60초 (기본 고립)</option>
        <option value="90">90초</option>
        <option value="120">120초 (복합 고중량)</option>
        <option value="180">180초 (스트렝스)</option>
      </select>

      <label class="form-label">중량 조절 단위 (+/-)</label>
      <select id="form-ex-step" class="select-field">
        <option value="0.5">0.5 kg (미세 증량)</option>
        <option value="1">1.0 kg (케이블/덤벨)</option>
        <option value="2">2.0 kg</option>
        <option value="2.5">2.5 kg (바벨 원판)</option>
        <option value="5">5.0 kg</option>
      </select>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <button style="flex:1; padding:14px;
